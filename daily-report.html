<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TrainFlow | التقرير اليومي</title><link rel="stylesheet" href="daily-report.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div><aside class="sidebar"><div class="brand"><div class="brand-icon"><i class="fa-solid fa-user-graduate"></i></div><div><h1>TrainFlow</h1><small>Trainee Panel</small></div></div><nav class="side-nav"><a href="trainee-dashboard.html" class=""><i class="fa-solid fa-house"></i><span>الرئيسية</span></a><a href="tasks.html" class=""><i class="fa-solid fa-list-check"></i><span>مهامي</span></a><a href="daily-report.html" class="active"><i class="fa-solid fa-pen-to-square"></i><span>التقرير اليومي</span></a><a href="profile.html" class=""><i class="fa-solid fa-user"></i><span>الملف الشخصي</span></a></nav><div class="side-bottom"><a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i><span>تسجيل الخروج</span></a></div></aside><main class="dashboard"><header class="dash-head"><div><p class="muted">التقرير اليومي</p><h1>ماذا أنجزت اليوم؟</h1><p class="muted">يمكنك إنشاء تقرير واحد لكل يوم وتعديله لاحقًا.</p></div></header><div class="card"><form id="form"><div class="form-group"><label>تاريخ التقرير</label><input class="input" type="date" id="date" required></div><div class="form-group"><label>الأعمال التي أنجزتها اليوم</label><textarea class="textarea" id="work" required></textarea></div><div class="form-group"><label>ماذا تعلمت اليوم؟</label><textarea class="textarea" id="learned"></textarea></div><div class="form-group"><label>التحديات أو المشاكل</label><textarea class="textarea" id="challenges"></textarea></div><div class="form-group"><label>خطة اليوم التالي</label><textarea class="textarea" id="plan"></textarea></div><div id="msg" class="message"></div><button class="btn" type="submit">حفظ التقرير وإرساله للمشرف</button></form></div></main><script>
const TF={
 get(k,f=[]){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},
 set(k,v){localStorage.setItem(k,JSON.stringify(v))},
 users(){return this.get('tf_users',[])}, tasks(){return this.get('tf_tasks',[])}, reports(){return this.get('tf_reports',[])}, invites(){return this.get('tf_invites',[])},
 session(){const id=localStorage.getItem('tf_session');return this.users().find(u=>u.id===id)||null},
 id(p='id'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
 esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))},
 date(s){if(!s)return '-';return new Date(s+'T00:00:00').toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'})},
 logout(){localStorage.removeItem('tf_session');location.href='login.html'},
 require(role){const u=this.session();if(!u){location.href='login.html';return null}if(role&&u.role!==role){location.href=u.role==='supervisor'?'supervisor-dashboard.html':'trainee-dashboard.html';return null}return u}
};

const u=TF.require('trainee');if(u){document.getElementById('logoutBtn').onclick=e=>{e.preventDefault();TF.logout()};const date=document.getElementById('date');date.value=new Date().toISOString().slice(0,10);function load(){const r=TF.reports().find(x=>x.traineeId===u.id&&x.date===date.value);['work','learned','challenges','plan'].forEach(k=>document.getElementById(k).value=r?.[k]||'')}date.onchange=load;load();document.getElementById('form').onsubmit=e=>{e.preventDefault();let reports=TF.reports(),i=reports.findIndex(x=>x.traineeId===u.id&&x.date===date.value);const item={id:i>=0?reports[i].id:TF.id('rep'),traineeId:u.id,supervisorId:u.supervisorId,date:date.value,work:document.getElementById('work').value.trim(),learned:document.getElementById('learned').value.trim(),challenges:document.getElementById('challenges').value.trim(),plan:document.getElementById('plan').value.trim(),updatedAt:new Date().toISOString()};if(i>=0)reports[i]=item;else reports.push(item);TF.set('tf_reports',reports);document.getElementById('msg').className='message success';document.getElementById('msg').textContent='تم حفظ التقرير، وسيظهر للمشرف في صفحة التقارير.'}}</script></body></html>
