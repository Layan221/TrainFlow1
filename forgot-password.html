<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrainFlow | استعادة كلمة المرور</title>

    <link rel="stylesheet" href="forgot-password.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >
</head>

<body>

    <main class="page">

        <section class="reset-card">

            <a href="login.html" class="back-button">
                <i class="fa-solid fa-arrow-right"></i>
                العودة لتسجيل الدخول
            </a>


            <div class="icon-box">
                <i class="fa-solid fa-key"></i>
            </div>


            <div class="page-header">

                <span>استعادة الحساب</span>

                <h1>نسيت كلمة المرور؟</h1>

                <p id="headerDescription">
                    أدخل بريدك الإلكتروني للعثور على حسابك.
                </p>

            </div>


            <!-- المرحلة الأولى -->
            <form id="emailForm">

                <div class="form-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="example@email.com"
                            required
                        >

                    </div>

                </div>


                <p id="emailMessage"></p>


                <button
                    type="submit"
                    class="primary-button"
                >
                    متابعة
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

            </form>


            <!-- المرحلة الثانية -->
            <form
                id="passwordForm"
                class="hidden"
            >

                <div class="account-found">

                    <div class="account-icon">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>

                    <div>
                        <span>تم العثور على الحساب</span>
                        <strong id="accountEmail">-</strong>
                    </div>

                </div>


                <div class="form-group">

                    <label for="newPassword">
                        كلمة المرور الجديدة
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="6 أحرف على الأقل"
                            minlength="6"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        تأكيد كلمة المرور
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-shield-halved"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="أعد كتابة كلمة المرور"
                            minlength="6"
                            required
                        >

                    </div>

                </div>


                <p id="passwordMessage"></p>


                <button
                    type="submit"
                    class="primary-button"
                >
                    حفظ كلمة المرور
                    <i class="fa-solid fa-check"></i>
                </button>

            </form>


            <!-- نجاح -->
            <div
                class="success-view hidden"
                id="successView"
            >

                <div class="success-icon">
                    <i class="fa-solid fa-check"></i>
                </div>

                <h2>
                    تم تغيير كلمة المرور
                </h2>

                <p>
                    يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة.
                </p>

                <a
                    href="login.html"
                    class="login-button"
                >
                    تسجيل الدخول
                </a>

            </div>

        </section>

    </main>


    <script>

        const emailForm =
            document.getElementById("emailForm");

        const passwordForm =
            document.getElementById("passwordForm");

        const successView =
            document.getElementById("successView");

        const emailMessage =
            document.getElementById("emailMessage");

        const passwordMessage =
            document.getElementById("passwordMessage");

        const headerDescription =
            document.getElementById("headerDescription");


        let foundUser = null;
        let foundType = null;


        emailForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                const supervisors =
                    JSON.parse(
                        localStorage.getItem(
                            "trainflow_supervisors"
                        )
                    ) || [];


                const trainees =
                    JSON.parse(
                        localStorage.getItem(
                            "trainflow_trainees"
                        )
                    ) || [];


                const supervisor =
                    supervisors.find(
                        function (user) {

                            return (
                                user.email.toLowerCase() ===
                                email
                            );

                        }
                    );


                if (supervisor) {

                    foundUser = supervisor;
                    foundType = "supervisor";

                    showPasswordForm(email);

                    return;

                }


                const trainee =
                    trainees.find(
                        function (user) {

                            return (
                                user.email.toLowerCase() ===
                                email &&
                                user.accountCreated === true
                            );

                        }
                    );


                if (trainee) {

                    foundUser = trainee;
                    foundType = "trainee";

                    showPasswordForm(email);

                    return;

                }


                emailMessage.innerText =
                    "لا يوجد حساب مسجل بهذا البريد الإلكتروني.";

                emailMessage.className =
                    "error-message";

            }
        );


        function showPasswordForm(email) {

            emailForm.classList.add(
                "hidden"
            );


            passwordForm.classList.remove(
                "hidden"
            );


            document.getElementById(
                "accountEmail"
            ).innerText =
                email;


            headerDescription.innerText =
                "اختر كلمة مرور جديدة لحسابك.";

        }


        passwordForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const newPassword =
                    document.getElementById(
                        "newPassword"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                if (
                    newPassword.length < 6
                ) {

                    showPasswordError(
                        "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
                    );

                    return;

                }


                if (
                    newPassword !==
                    confirmPassword
                ) {

                    showPasswordError(
                        "كلمتا المرور غير متطابقتين."
                    );

                    return;

                }


                if (
                    foundType ===
                    "supervisor"
                ) {

                    updateSupervisorPassword(
                        newPassword
                    );

                }


                if (
                    foundType ===
                    "trainee"
                ) {

                    updateTraineePassword(
                        newPassword
                    );

                }


                passwordForm.classList.add(
                    "hidden"
                );


                successView.classList.remove(
                    "hidden"
                );


                headerDescription.style.display =
                    "none";

            }
        );


        function updateSupervisorPassword(
            newPassword
        ) {

            let supervisors =
                JSON.parse(
                    localStorage.getItem(
                        "trainflow_supervisors"
                    )
                ) || [];


            supervisors =
                supervisors.map(
                    function (user) {

                        if (
                            user.id ===
                            foundUser.id
                        ) {

                            user.password =
                                newPassword;

                        }


                        return user;

                    }
                );


            localStorage.setItem(
                "trainflow_supervisors",
                JSON.stringify(
                    supervisors
                )
            );

        }


        function updateTraineePassword(
            newPassword
        ) {

            let trainees =
                JSON.parse(
                    localStorage.getItem(
                        "trainflow_trainees"
                    )
                ) || [];


            trainees =
                trainees.map(
                    function (user) {

                        if (
                            user.id ===
                            foundUser.id
                        ) {

                            user.password =
                                newPassword;

                        }


                        return user;

                    }
                );


            localStorage.setItem(
                "trainflow_trainees",
                JSON.stringify(
                    trainees
                )
            );

        }


        function showPasswordError(text) {

            passwordMessage.innerText =
                text;

            passwordMessage.className =
                "error-message";

        }

    </script>

</body>

</html>
