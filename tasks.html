<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TrainFlow | مهامي</title>

    <link
        rel="stylesheet"
        href="tasks.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >
</head>


<body>

<main class="page-container">


    <!-- ================================
         الرجوع
    ================================= -->

    <a
        href="trainee-dashboard.html"
        class="back-button"
    >

        <i class="fa-solid fa-arrow-right"></i>

        العودة للوحة المتدرب

    </a>



    <!-- ================================
         HEADER
    ================================= -->

    <header class="page-header">

        <div>

            <span>
                مهام التدريب
            </span>

            <h1>
                مهامي
            </h1>

            <p>
                جميع المهام المسندة إليك خلال فترة التدريب.
            </p>

        </div>


        <div class="header-icon">

            <i class="fa-solid fa-list-check"></i>

        </div>

    </header>



    <!-- ================================
         الإحصائيات
    ================================= -->

    <section class="stats-grid">


        <div class="stat-card">

            <span>
                إجمالي المهام
            </span>

            <strong id="totalTasks">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                لم تبدأ
            </span>

            <strong id="pendingTasks">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                قيد التنفيذ
            </span>

            <strong id="progressTasks">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                مكتملة
            </span>

            <strong id="completedTasks">
                0
            </strong>

        </div>


    </section>



    <!-- ================================
         البحث والفلاتر
    ================================= -->

    <section class="tools-card">


        <!-- البحث -->

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="ابحث في مهامك..."
            >

        </div>



        <!-- الفلاتر -->

        <div class="filters">


            <button
                type="button"
                class="filter-button active"
                data-filter="all"
            >
                الكل
            </button>


            <button
                type="button"
                class="filter-button"
                data-filter="pending"
            >
                لم تبدأ
            </button>


            <button
                type="button"
                class="filter-button"
                data-filter="progress"
            >
                قيد التنفيذ
            </button>


            <button
                type="button"
                class="filter-button"
                data-filter="completed"
            >
                مكتملة
            </button>


        </div>

    </section>



    <!-- ================================
         قائمة المهام
    ================================= -->

    <section class="tasks-card">


        <div class="section-header">

            <div>

                <span>
                    قائمة المهام
                </span>

                <h2>
                    جميع المهام
                </h2>

            </div>


            <span
                class="results-count"
                id="resultsCount"
            >
                0 مهام
            </span>

        </div>



        <!-- المهام -->

        <div
            class="tasks-list"
            id="tasksList"
        ></div>



        <!-- لا توجد مهام -->

        <div
            class="empty-state"
            id="emptyState"
        >

            <div class="empty-icon">

                <i class="fa-regular fa-folder-open"></i>

            </div>

            <h3>
                لا توجد مهام
            </h3>

            <p id="emptyText">
                لم يتم إسناد أي مهمة إليك حتى الآن.
            </p>

        </div>


    </section>


</main>



<script>

/* =====================================================
   أدوات عامة
===================================================== */

function readArray(key) {

    try {

        const data = JSON.parse(
            localStorage.getItem(key) || "[]"
        );

        return Array.isArray(data)
            ? data
            : [];

    }

    catch (error) {

        console.error(
            "خطأ في قراءة:",
            key,
            error
        );

        return [];

    }

}



function normalize(value) {

    return String(value ?? "")
        .trim()
        .toLowerCase();

}



/* =====================================================
   المستخدم الحالي
===================================================== */

function getCurrentUser() {

    const possibleKeys = [

        "trainflowCurrentUser",
        "trainflow_current_user"

    ];


    for (const key of possibleKeys) {

        try {

            const user = JSON.parse(
                localStorage.getItem(key) || "null"
            );


            if (user) {

                return user;

            }

        }

        catch (error) {

            console.error(
                "خطأ في قراءة المستخدم:",
                key
            );

        }

    }


    return null;

}



const currentUser =
    getCurrentUser();



/* حماية الصفحة */

if (!currentUser) {

    window.location.replace(
        "login.html"
    );

}



/* =====================================================
   بيانات المتدرب الأصلية
===================================================== */

function getCurrentTrainee() {

    const trainees = [

        ...readArray(
            "trainflowTrainees"
        ),

        ...readArray(
            "trainflow_trainees"
        ),

        ...readArray(
            "trainees"
        )

    ];


    let trainee = null;



    /* ID */

    if (
        currentUser &&
        currentUser.id !== undefined
    ) {

        trainee = trainees.find(
            function (item) {

                const itemId =
                    item.id ||
                    item.traineeId ||
                    item.userId;


                return (

                    itemId !== undefined &&

                    String(itemId) ===
                    String(currentUser.id)

                );

            }
        );

    }



    /* البريد */

    if (
        !trainee &&
        currentUser?.email
    ) {

        trainee = trainees.find(
            function (item) {

                return (

                    normalize(item.email) ===
                    normalize(currentUser.email)

                );

            }
        );

    }



    /* كود الربط */

    if (!trainee) {

        const currentCode =

            currentUser?.linkCode ||

            currentUser?.code ||

            currentUser?.traineeCode;


        if (currentCode) {

            trainee = trainees.find(
                function (item) {

                    const itemCode =

                        item.linkCode ||

                        item.code ||

                        item.traineeCode;


                    return (

                        normalize(itemCode) ===
                        normalize(currentCode)

                    );

                }
            );

        }

    }


    return (
        trainee ||
        currentUser ||
        {}
    );

}



/* =====================================================
   جميع المهام
===================================================== */

function getAllTasks() {

    /*
        ندعم المفتاحين مؤقتًا
        حتى ما تضيع المهام القديمة.
    */

    const first =
        readArray(
            "trainflow_tasks"
        );


    const second =
        readArray(
            "trainflowTasks"
        );


    const tasks = [];


    [...first, ...second].forEach(
        function (task) {

            const exists =
                tasks.some(
                    function (item) {

                        return (
                            String(item.id) ===
                            String(task.id)
                        );

                    }
                );


            if (!exists) {

                tasks.push(task);

            }

        }
    );


    return tasks;

}



/* =====================================================
   مهام المتدرب الحالي فقط
===================================================== */

function getMyTasks() {

    const trainee =
        getCurrentTrainee();


    const allTasks =
        getAllTasks();


    const traineeId =

        trainee.id ||

        trainee.traineeId ||

        trainee.userId ||

        currentUser?.id;


    const traineeEmail =

        trainee.email ||

        currentUser?.email;


    return allTasks.filter(
        function (task) {


            const taskTraineeId =

                task.traineeId ||

                task.assignedTo ||

                task.userId;



            /* =========================
               المطابقة بالـ ID
            ========================= */

            if (
                traineeId !== undefined &&
                taskTraineeId !== undefined &&
                String(traineeId) ===
                String(taskTraineeId)
            ) {

                return true;

            }



            /* =========================
               المطابقة بالبريد
            ========================= */

            if (
                traineeEmail &&
                task.traineeEmail &&
                normalize(traineeEmail) ===
                normalize(task.traineeEmail)
            ) {

                return true;

            }


            return false;

        }
    );

}



/* =====================================================
   توحيد حالة المهمة
===================================================== */

function getTaskStatus(task) {

    const status =
        normalize(task.status);


    /* مكتملة */

    if (
        status === "completed" ||
        status === "done" ||
        status === "مكتملة" ||
        status === "منجز" ||
        status === "منجزة" ||
        status === "تم الإنجاز"
    ) {

        return "completed";

    }



    /* قيد التنفيذ */

    if (
        status === "progress" ||
        status === "in-progress" ||
        status === "in_progress" ||
        status === "قيد التنفيذ"
    ) {

        return "progress";

    }



    /* أي حالة أخرى تعتبر لم تبدأ */

    return "pending";

}



/* =====================================================
   بيانات الحالة
===================================================== */

function getStatusInfo(task) {

    const status =
        getTaskStatus(task);


    if (status === "completed") {

        return {

            status: "completed",

            text: "مكتملة",

            icon:
                "fa-solid fa-check"

        };

    }


    if (status === "progress") {

        return {

            status: "progress",

            text: "قيد التنفيذ",

            icon:
                "fa-regular fa-clock"

        };

    }


    return {

        status: "pending",

        text: "لم تبدأ",

        icon:
            "fa-regular fa-circle"

    };

}



/* =====================================================
   الأولوية
===================================================== */

function getPriorityInfo(task) {

    const priority =
        normalize(task.priority);


    if (
        priority === "high" ||
        priority === "عالية"
    ) {

        return {

            className: "high",

            text: "أولوية عالية"

        };

    }


    if (
        priority === "medium" ||
        priority === "متوسطة"
    ) {

        return {

            className: "medium",

            text: "أولوية متوسطة"

        };

    }


    return {

        className: "low",

        text: "أولوية منخفضة"

    };

}



/* =====================================================
   التاريخ
===================================================== */

function formatDate(value) {

    if (!value) {

        return "بدون موعد";

    }


    try {

        const date =
            new Date(
                value + "T00:00:00"
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return value;

        }


        return date.toLocaleDateString(
            "ar-SA",
            {

                year: "numeric",

                month: "long",

                day: "numeric"

            }
        );

    }

    catch (error) {

        return value;

    }

}



/* =====================================================
   حماية النص
===================================================== */

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(value ?? "");


    return div.innerHTML;

}



/* =====================================================
   عناصر الصفحة
===================================================== */

const totalTasksElement =
    document.getElementById(
        "totalTasks"
    );


const pendingTasksElement =
    document.getElementById(
        "pendingTasks"
    );


const progressTasksElement =
    document.getElementById(
        "progressTasks"
    );


const completedTasksElement =
    document.getElementById(
        "completedTasks"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const filterButtons =
    document.querySelectorAll(
        ".filter-button"
    );


const tasksList =
    document.getElementById(
        "tasksList"
    );


const resultsCount =
    document.getElementById(
        "resultsCount"
    );


const emptyState =
    document.getElementById(
        "emptyState"
    );


const emptyText =
    document.getElementById(
        "emptyText"
    );


let activeFilter =
    "all";



/* =====================================================
   الإحصائيات
===================================================== */

function updateStats() {

    const tasks =
        getMyTasks();


    const pending =
        tasks.filter(
            function (task) {

                return (
                    getTaskStatus(task) ===
                    "pending"
                );

            }
        );


    const progress =
        tasks.filter(
            function (task) {

                return (
                    getTaskStatus(task) ===
                    "progress"
                );

            }
        );


    const completed =
        tasks.filter(
            function (task) {

                return (
                    getTaskStatus(task) ===
                    "completed"
                );

            }
        );


    totalTasksElement.textContent =
        tasks.length;


    pendingTasksElement.textContent =
        pending.length;


    progressTasksElement.textContent =
        progress.length;


    completedTasksElement.textContent =
        completed.length;

}



/* =====================================================
   فلترة المهام
===================================================== */

function getFilteredTasks() {

    const searchValue =
        normalize(
            searchInput.value
        );


    return getMyTasks().filter(
        function (task) {

            const status =
                getTaskStatus(task);


            const title =
                normalize(
                    task.title ||
                    task.taskTitle ||
                    task.name
                );


            const description =
                normalize(
                    task.description ||
                    task.details
                );


            const matchesFilter =

                activeFilter === "all"

                ||

                status === activeFilter;


            const matchesSearch =

                !searchValue

                ||

                title.includes(
                    searchValue
                )

                ||

                description.includes(
                    searchValue
                );


            return (

                matchesFilter &&
                matchesSearch

            );

        }
    );

}



/* =====================================================
   عرض المهام
===================================================== */

function renderTasks() {

    let tasks =
        getFilteredTasks();



    /*
        الأحدث أولًا
    */

    tasks.sort(
        function (a, b) {

            const firstDate =
                new Date(
                    a.createdAt || 0
                );


            const secondDate =
                new Date(
                    b.createdAt || 0
                );


            return (
                secondDate -
                firstDate
            );

        }
    );



    tasksList.innerHTML =
        "";



    /* عدد النتائج */

    resultsCount.textContent =

        tasks.length === 1

            ? "مهمة واحدة"

            : tasks.length + " مهام";



    /* =============================================
       لا توجد نتائج
    ============================================= */

    if (tasks.length === 0) {

        emptyState.style.display =
            "flex";


        if (
            searchInput.value.trim()
        ) {

            emptyText.textContent =
                "لا توجد مهمة مطابقة لبحثك.";

        }

        else if (
            activeFilter !== "all"
        ) {

            emptyText.textContent =
                "لا توجد مهام بهذه الحالة.";

        }

        else {

            emptyText.textContent =
                "لم يتم إسناد أي مهمة إليك حتى الآن.";

        }


        return;

    }



    emptyState.style.display =
        "none";



    /* =============================================
       إنشاء البطاقات
    ============================================= */

    tasks.forEach(
        function (task) {


            const status =
                getStatusInfo(task);


            const priority =
                getPriorityInfo(task);


            const title =

                task.title ||

                task.taskTitle ||

                task.name ||

                "مهمة";


            const description =

                task.description ||

                task.details ||

                "لا يوجد وصف للمهمة.";


            const dueDate =

                task.dueDate ||

                task.deadline ||

                task.date ||

                "";


            const article =
                document.createElement(
                    "article"
                );


            article.className =
                "task-item";


            article.innerHTML = `

                <div
                    class="task-status ${status.status}"
                >

                    <i class="${status.icon}"></i>

                </div>



                <div class="task-content">


                    <div class="task-title-row">

                        <h3>

                            ${escapeHTML(title)}

                        </h3>


                        <span
                            class="priority ${priority.className}"
                        >

                            ${priority.text}

                        </span>

                    </div>



                    <p>

                        ${escapeHTML(description)}

                    </p>



                    <div class="task-meta">


                        <span>

                            <i class="fa-regular fa-calendar"></i>

                            ${escapeHTML(
                                formatDate(dueDate)
                            )}

                        </span>



                        <span
                            class="status-label ${status.status}"
                        >

                            ${status.text}

                        </span>


                    </div>


                </div>



                <a
                    href="task-details.html?id=${encodeURIComponent(task.id)}"
                    class="details-button"
                >

                    عرض التفاصيل

                    <i class="fa-solid fa-chevron-left"></i>

                </a>

            `;


            tasksList.appendChild(
                article
            );

        }
    );

}



/* =====================================================
   البحث
===================================================== */

searchInput.addEventListener(
    "input",
    function () {

        renderTasks();

    }
);



/* =====================================================
   الفلاتر
===================================================== */

filterButtons.forEach(
    function (button) {

        button.addEventListener(
            "click",
            function () {


                filterButtons.forEach(
                    function (item) {

                        item.classList.remove(
                            "active"
                        );

                    }
                );


                button.classList.add(
                    "active"
                );


                activeFilter =
                    button.dataset.filter;


                renderTasks();

            }
        );

    }
);



/* =====================================================
   تحديث عند الرجوع للصفحة
===================================================== */

window.addEventListener(
    "focus",
    function () {

        updateStats();

        renderTasks();

    }
);



/* =====================================================
   تحديث لو تغيرت المهمة في تبويب آخر
===================================================== */

window.addEventListener(
    "storage",
    function () {

        updateStats();

        renderTasks();

    }
);



/* =====================================================
   تشغيل الصفحة
===================================================== */

updateStats();

renderTasks();


</script>

</body>

</html>
