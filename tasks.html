<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TrainFlow | المهام</title><link rel="stylesheet" href="tasks.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div><main class="container"><a class="ghost-btn" href="trainee-dashboard.html"><i class="fa-solid fa-arrow-right"></i> العودة للوحة التحكم</a><div class="section-title" style="margin-top:20px"><span>المهام</span><h2>مهامي</h2><p>لا تظهر هنا إلا المهام المرتبطة بحسابك.</p></div><div class="card"><div class="toolbar"><input class="input" id="search" placeholder="ابحث عن مهمة..."><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="ghost-btn filter" data-v="all">الكل</button><button class="ghost-btn filter" data-v="pending">لم تبدأ</button><button class="ghost-btn filter" data-v="progress">قيد التنفيذ</button><button class="ghost-btn filter" data-v="completed">مكتملة</button></div></div><div id="list" class="list"></div></div></main><script>
const TF={
 get(k,f=[]){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},
 set(k,v){localStorage.setItem(k,JSON.stringify(v))},
 users(){return this.get('tf_users',[])}, tasks(){return this.get('tf_tasks',[])}, reports(){return this.get('tf_reports',[])}, invites(){return this.get('tf_invites',[])},
 session(){const id=localStorage.getItem('tf_session');return this.users().find(u=>u.id===id)||null},
 id(p='id'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
 esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))},
 date(s){if(!s)return '-';return new Date(s+'T00:00:00').toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'})},
 logout(){localStorage.removeItem('tf_session');location.href='login.html'},
 require(role){const u=this.session();if(!u){location.href='login.html';return null}if(role&&u.role!==role){location.href=u.role==='supervisor'?'supervisor-dashboard.html':'trainee-dashboard.html';return null}return u}
};

const u=TF.require('trainee');let filter='all';if(u){const list=document.getElementById('list'),search=document.getElementById('search');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.v;render()});search.oninput=render;function render(){const q=search.value.trim().toLowerCase();const tasks=TF.tasks().filter(t=>t.traineeId===u.id&&(filter==='all'||t.status===filter)&&t.title.toLowerCase().includes(q));list.innerHTML=tasks.length?tasks.map(t=>`<div class="list-item"><div class="list-main"><h3>${TF.esc(t.title)}</h3><p>${TF.esc(t.description)}<br>${TF.date(t.dueDate)}</p></div><div style="display:flex;align-items:center;gap:8px"><label class="check-wrap"><input type="checkbox" data-id="${t.id}" ${t.status==='completed'?'checked':''}> مكتملة</label><a class="ghost-btn" href="task-details.html?id=${t.id}">التفاصيل</a></div></div>`).join(''):'<div class="empty"><i class="fa-solid fa-folder-open"></i><h3>لا توجد مهام</h3><p>لا توجد نتائج مطابقة.</p></div>';document.querySelectorAll('input[type=checkbox][data-id]').forEach(c=>c.onchange=()=>{let all=TF.tasks();const i=all.findIndex(t=>t.id===c.dataset.id&&t.traineeId===u.id);if(i>=0){all[i].status=c.checked?'completed':'progress';all[i].completedAt=c.checked?new Date().toISOString():null;TF.set('tf_tasks',all);render()}})}render()}</script></body></html>
