<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TrainFlow | التقارير اليومية</title><link rel="stylesheet" href="reports.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div><aside class="sidebar"><div class="brand"><div class="brand-icon"><i class="fa-solid fa-user-graduate"></i></div><div><h1>TrainFlow</h1><small>Supervisor Panel</small></div></div><nav class="side-nav"><a href="supervisor-dashboard.html" class=""><i class="fa-solid fa-house"></i><span>الرئيسية</span></a><a href="add-trainee.html" class=""><i class="fa-solid fa-user-plus"></i><span>إضافة متدرب</span></a><a href="supervisor-dashboard.html#trainees-section" class=""><i class="fa-solid fa-users"></i><span>المتدربون</span></a><a href="supervisor-dashboard.html#tasks-section" class=""><i class="fa-solid fa-list-check"></i><span>المهام</span></a><a href="reports.html" class="active"><i class="fa-solid fa-file-lines"></i><span>التقارير اليومية</span></a><a href="profile.html" class=""><i class="fa-solid fa-user"></i><span>الملف الشخصي</span></a></nav><div class="side-bottom"><a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i><span>تسجيل الخروج</span></a></div></aside><main class="dashboard"><header class="dash-head"><div><p class="muted">التقارير اليومية</p><h1>تقارير المتدربين</h1><p class="muted">تعرض فقط تقارير المتدربين المرتبطين بك.</p></div></header><div class="card"><div class="toolbar"><select id="trainee" class="select" style="max-width:300px"><option value="all">جميع المتدربين</option></select><input id="date" class="input" type="date" style="max-width:220px"></div><div id="list" class="list"></div></div></main><script>
const TF={
 get(k,f=[]){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},
 set(k,v){localStorage.setItem(k,JSON.stringify(v))},
 users(){return this.get('tf_users',[])}, tasks(){return this.get('tf_tasks',[])}, reports(){return this.get('tf_reports',[])}, invites(){return this.get('tf_invites',[])},
 session(){const id=localStorage.getItem('tf_session');return this.users().find(u=>u.id===id)||null},
 id(p='id'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
 esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))},
 date(s){if(!s)return '-';return new Date(s+'T00:00:00').toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'})},
 logout(){localStorage.removeItem('tf_session');location.href='login.html'},
 require(role){const u=this.session();if(!u){location.href='login.html';return null}if(role&&u.role!==role){location.href=u.role==='supervisor'?'supervisor-dashboard.html':'trainee-dashboard.html';return null}return u}
};

const u=TF.require('supervisor');if(u){document.getElementById('logoutBtn').onclick=e=>{e.preventDefault();TF.logout()};const trainees=TF.users().filter(x=>x.role==='trainee'&&x.supervisorId===u.id),sel=document.getElementById('trainee'),date=document.getElementById('date');sel.innerHTML='<option value="all">جميع المتدربين</option>'+trainees.map(x=>`<option value="${x.id}">${TF.esc(x.name)}</option>`).join('');const q=new URLSearchParams(location.search).get('trainee');if(q&&trainees.some(x=>x.id===q))sel.value=q;sel.onchange=render;date.onchange=render;function render(){const ids=new Set(trainees.map(x=>x.id));const reps=TF.reports().filter(r=>ids.has(r.traineeId)&&(sel.value==='all'||r.traineeId===sel.value)&&(!date.value||r.date===date.value)).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('list').innerHTML=reps.length?reps.map(r=>{const tr=trainees.find(x=>x.id===r.traineeId);return `<article class="list-item report-card" style="align-items:flex-start"><div class="list-main"><h3>${TF.esc(tr?.name||'')} — ${TF.date(r.date)}</h3><p><b>الإنجاز:</b> ${TF.esc(r.work)}</p>${r.learned?`<p><b>تعلم:</b> ${TF.esc(r.learned)}</p>`:''}${r.challenges?`<p><b>تحديات:</b> ${TF.esc(r.challenges)}</p>`:''}${r.plan?`<p><b>الخطة:</b> ${TF.esc(r.plan)}</p>`:''}</div></article>`}).join(''):'<div class="empty"><i class="fa-solid fa-file-lines"></i><h3>لا توجد تقارير مطابقة</h3></div>'}render()}</script></body></html>
