<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrainFlow | تسجيل الدخول</title>

    <link rel="stylesheet" href="login.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >
</head>

<body>

    <main class="page">

        <section class="login-card">

            <!-- الجانب التعريفي -->
            <div class="info-side">

                <a href="index.html" class="brand">

                    <div class="brand-icon">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>

                    <div>
                        <strong>TrainFlow</strong>
                        <span>متابعة التدريب</span>
                    </div>

                </a>


                <div class="info-content">

                    <span class="small-label">
                        مرحباً بعودتك
                    </span>

                    <h1>
                        تابع تدريبك
                        <span>من مكان واحد.</span>
                    </h1>

                    <p>
                        سجّل دخولك للوصول إلى حسابك ومتابعة
                        التدريب والمهام والتقارير.
                    </p>


                    <div class="visual-card">

                        <div class="visual-icon">
                            <i class="fa-solid fa-layer-group"></i>
                        </div>

                        <div>
                            <span>TrainFlow</span>
                            <strong>تنظيم أبسط للتدريب</strong>
                        </div>

                    </div>

                </div>

            </div>


            <!-- تسجيل الدخول -->
            <div class="form-side">

                <a href="index.html" class="back-button">
                    <i class="fa-solid fa-arrow-right"></i>
                    العودة للرئيسية
                </a>


                <div class="form-header">

                    <span>
                        تسجيل الدخول
                    </span>

                    <h2>
                        أهلاً بك من جديد
                    </h2>

                    <p>
                        أدخل بيانات حسابك للمتابعة.
                    </p>

                </div>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            البريد الإلكتروني
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                placeholder="example@email.com"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <div class="password-label">

                            <label for="password">
                                كلمة المرور
                            </label>

                            <a href="forgot-password.html">
                                نسيت كلمة المرور؟
                            </a>

                        </div>


                        <div class="input-wrapper password-wrapper">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="password"
                                placeholder="أدخل كلمة المرور"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="إظهار كلمة المرور"
                            >
                                <i class="fa-regular fa-eye"></i>
                            </button>

                        </div>

                    </div>


                    <p id="message"></p>


                    <button
                        type="submit"
                        class="login-button"
                    >
                        تسجيل الدخول

                        <i class="fa-solid fa-arrow-left"></i>
                    </button>

                </form>


                <div class="register-link">

                    ليس لديك حساب؟

                    <a href="register.html">
                        إنشاء حساب
                    </a>

                </div>

            </div>

        </section>

    </main>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");

        const passwordToggle =
            document.getElementById("passwordToggle");


        /*
            إظهار / إخفاء كلمة المرور
        */

        passwordToggle.addEventListener(
            "click",
            function () {

                const password =
                    document.getElementById("password");

                const icon =
                    passwordToggle.querySelector("i");


                if (password.type === "password") {

                    password.type = "text";

                    icon.className =
                        "fa-regular fa-eye-slash";

                } else {

                    password.type = "password";

                    icon.className =
                        "fa-regular fa-eye";

                }

            }
        );


        /*
            تسجيل الدخول
        */

        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById("password")
                        .value;


                if (!email || !password) {

                    showError(
                        "يرجى إدخال البريد الإلكتروني وكلمة المرور."
                    );

                    return;

                }


                const supervisors =
                    JSON.parse(
                        localStorage.getItem(
                            "trainflow_supervisors"
                        )
                    ) || [];


                const trainees =
                    JSON.parse(
                        localStorage.getItem(
                            "trainflow_trainees"
                        )
                    ) || [];


                /*
                    البحث أولاً عن حساب مشرف
                */

                const supervisor =
                    supervisors.find(
                        function (user) {

                            return (
                                user.email
                                    .toLowerCase() ===
                                    email &&
                                user.password ===
                                    password
                            );

                        }
                    );


                if (supervisor) {

                    const sessionUser = {

                        id:
                            supervisor.id,

                        name:
                            supervisor.name,

                        email:
                            supervisor.email,

                        role:
                            "supervisor"

                    };


                    localStorage.setItem(
                        "trainflow_current_user",
                        JSON.stringify(
                            sessionUser
                        )
                    );


                    window.location.href =
                        "supervisor-dashboard.html";

                    return;

                }


                /*
                    إذا لم يكن مشرفاً، نبحث عن متدرب
                */

                const trainee =
                    trainees.find(
                        function (user) {

                            return (
                                user.email
                                    .toLowerCase() ===
                                    email &&
                                user.password ===
                                    password &&
                                user.accountCreated ===
                                    true
                            );

                        }
                    );


                if (trainee) {

                    const sessionUser = {

                        id:
                            trainee.id,

                        name:
                            trainee.name,

                        email:
                            trainee.email,

                        role:
                            "trainee",

                        supervisorId:
                            trainee.supervisorId

                    };


                    localStorage.setItem(
                        "trainflow_current_user",
                        JSON.stringify(
                            sessionUser
                        )
                    );


                    window.location.href =
                        "trainee-dashboard.html";

                    return;

                }


                showError(
                    "البريد الإلكتروني أو كلمة المرور غير صحيحة."
                );

            }
        );


        function showError(text) {

            message.innerText =
                text;

            message.className =
                "error-message";

        }

    </script>

</body>

</html>
