<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrainFlow | تسجيل الدخول</title>

    <link rel="stylesheet" href="login.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <a href="index.html" class="back-button">
                <i class="fa-solid fa-arrow-right"></i>
                الرجوع
            </a>


            <div class="auth-header">

                <div class="brand-icon">
                    <i class="fa-solid fa-layer-group"></i>
                </div>

                <span>TrainFlow</span>

                <h1>تسجيل الدخول</h1>

                <p>
                    اختر نوع الحساب ثم أدخل بيانات الدخول.
                </p>

            </div>


            <div class="role-selector">

                <button
                    type="button"
                    class="role-button active"
                    id="supervisorButton"
                >
                    <i class="fa-solid fa-user-tie"></i>
                    مشرف
                </button>


                <button
                    type="button"
                    class="role-button"
                    id="traineeButton"
                >
                    <i class="fa-solid fa-user-graduate"></i>
                    متدرب
                </button>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="example@email.com"
                            required
                        >

                    </div>

                </div>


                <div class="form-group" id="passwordGroup">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="أدخل كلمة المرور"
                        >

                    </div>

                </div>


                <div
                    class="form-group"
                    id="traineeCodeGroup"
                    style="display: none;"
                >

                    <label for="traineeCode">
                        كود الدخول
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-key"></i>

                        <input
                            type="text"
                            id="traineeCode"
                            placeholder="أدخل الكود الذي أعطاك المشرف"
                        >

                    </div>

                </div>


                <p id="message"></p>


                <button
                    type="submit"
                    class="submit-button"
                >
                    تسجيل الدخول
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

            </form>


            <div
                class="register-link"
                id="registerSection"
            >

                <span>
                    مشرف جديد؟
                </span>

                <a href="register.html">
                    إنشاء حساب مشرف
                </a>

            </div>

        </section>

    </main>


    <script>

        const supervisorButton =
            document.getElementById("supervisorButton");

        const traineeButton =
            document.getElementById("traineeButton");

        const passwordGroup =
            document.getElementById("passwordGroup");

        const traineeCodeGroup =
            document.getElementById("traineeCodeGroup");

        const passwordInput =
            document.getElementById("password");

        const traineeCodeInput =
            document.getElementById("traineeCode");

        const registerSection =
            document.getElementById("registerSection");

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");


        let selectedRole = "supervisor";


        supervisorButton.addEventListener("click", function () {

            selectedRole = "supervisor";

            supervisorButton.classList.add("active");
            traineeButton.classList.remove("active");

            passwordGroup.style.display = "block";
            traineeCodeGroup.style.display = "none";

            registerSection.style.display = "block";

            passwordInput.required = true;
            traineeCodeInput.required = false;

            message.innerText = "";

        });


        traineeButton.addEventListener("click", function () {

            selectedRole = "trainee";

            traineeButton.classList.add("active");
            supervisorButton.classList.remove("active");

            passwordGroup.style.display = "none";
            traineeCodeGroup.style.display = "block";

            registerSection.style.display = "none";

            passwordInput.required = false;
            traineeCodeInput.required = true;

            message.innerText = "";

        });


        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            if (selectedRole === "supervisor") {

                loginSupervisor(email);

            } else {

                loginTrainee(email);

            }

        });


        function loginSupervisor(email) {

            const password =
                passwordInput.value;


            const supervisors =
                JSON.parse(
                    localStorage.getItem("trainflow_supervisors")
                ) || [];


            const supervisor =
                supervisors.find(function (item) {

                    return (
                        item.email.toLowerCase() === email &&
                        item.password === password
                    );

                });


            if (!supervisor) {

                showError(
                    "البريد الإلكتروني أو كلمة المرور غير صحيحة"
                );

                return;

            }


            localStorage.setItem(
                "trainflow_current_user",
                JSON.stringify({
                    id: supervisor.id,
                    name: supervisor.name,
                    email: supervisor.email,
                    role: "supervisor"
                })
            );


            window.location.href =
                "supervisor-dashboard.html";

        }


        function loginTrainee(email) {

            const code =
                traineeCodeInput.value.trim();


            const trainees =
                JSON.parse(
                    localStorage.getItem("trainflow_trainees")
                ) || [];


            const trainee =
                trainees.find(function (item) {

                    return (
                        item.email.toLowerCase() === email &&
                        item.loginCode === code
                    );

                });


            if (!trainee) {

                showError(
                    "البريد الإلكتروني أو كود الدخول غير صحيح"
                );

                return;

            }


            localStorage.setItem(
                "trainflow_current_user",
                JSON.stringify({
                    id: trainee.id,
                    name: trainee.name,
                    email: trainee.email,
                    role: "trainee",
                    supervisorId: trainee.supervisorId
                })
            );


            window.location.href =
                "trainee-dashboard.html";

        }


        function showError(text) {

            message.className = "error-message";
            message.innerText = text;

        }

    </script>

</body>

</html>
