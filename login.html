<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TrainFlow | تسجيل الدخول</title><link rel="stylesheet" href="login.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div><main class="container auth"><section class="auth-side"><div class="brand"><div class="brand-icon"><i class="fa-solid fa-user-graduate"></i></div><div><h1>TrainFlow</h1><small>Training Management System</small></div></div><h2>أهلاً بعودتك</h2><p>سجل دخولك للوصول إلى بياناتك الفعلية فقط.</p></section><section class="card auth-card"><a class="ghost-btn" href="index.html"><i class="fa-solid fa-house"></i> الرئيسية</a><div class="section-title" style="margin-top:18px"><span>تسجيل الدخول</span><h2>أدخل بيانات حسابك</h2></div><div class="role-tabs"><button id="traineeBtn" class="role-btn active" type="button">متدرب</button><button id="supervisorBtn" class="role-btn" type="button">مشرف</button></div><form id="form"><div class="form-group"><label>البريد الإلكتروني</label><input class="input" id="email" type="email" required></div><div class="form-group"><label>كلمة المرور</label><input class="input" id="password" type="password" required></div><div id="msg" class="message"></div><button class="btn" style="width:100%" type="submit">تسجيل الدخول</button></form><p class="muted" style="margin-top:14px;text-align:center">ليس لديك حساب؟ <a href="register.html" style="color:#2563eb">إنشاء حساب</a></p></section></main><script>
const TF={
 get(k,f=[]){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},
 set(k,v){localStorage.setItem(k,JSON.stringify(v))},
 users(){return this.get('tf_users',[])}, tasks(){return this.get('tf_tasks',[])}, reports(){return this.get('tf_reports',[])}, invites(){return this.get('tf_invites',[])},
 session(){const id=localStorage.getItem('tf_session');return this.users().find(u=>u.id===id)||null},
 id(p='id'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
 esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))},
 date(s){if(!s)return '-';return new Date(s+'T00:00:00').toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'})},
 logout(){localStorage.removeItem('tf_session');location.href='login.html'},
 require(role){const u=this.session();if(!u){location.href='login.html';return null}if(role&&u.role!==role){location.href=u.role==='supervisor'?'supervisor-dashboard.html':'trainee-dashboard.html';return null}return u}
};

let role='trainee';const t=document.getElementById('traineeBtn'),s=document.getElementById('supervisorBtn');function setRole(r){role=r;t.classList.toggle('active',r==='trainee');s.classList.toggle('active',r==='supervisor')}t.onclick=()=>setRole('trainee');s.onclick=()=>setRole('supervisor');document.getElementById('form').onsubmit=e=>{e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,msg=document.getElementById('msg');const u=TF.users().find(x=>x.email===email&&x.password===password);if(!u){msg.className='message error';msg.textContent='البريد الإلكتروني أو كلمة المرور غير صحيحة';return}if(u.role!==role){msg.className='message error';msg.textContent='نوع الحساب المختار لا يطابق هذا الحساب';return}TF.set('tf_session',u.id);location.href=u.role==='supervisor'?'supervisor-dashboard.html':'trainee-dashboard.html'}</script></body></html>
