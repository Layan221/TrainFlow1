<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TrainFlow | إضافة مهمة</title><link rel="stylesheet" href="add-task.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div><main class="container"><button class="ghost-btn" onclick="history.back()"><i class="fa-solid fa-arrow-right"></i> رجوع</button><div class="section-title" style="margin-top:20px"><span>إدارة المهام</span><h2>إضافة مهمة جديدة</h2><p>اختر المتدرب واكتب المهمة والملاحظات. لن تظهر المهمة إلا للمتدرب المختار.</p></div><section class="dash-grid"><div class="card"><form id="form"><div class="form-group"><label>المتدرب</label><select class="select" id="trainee" required><option value="">اختر المتدرب</option></select></div><div class="form-group"><label>عنوان المهمة</label><input class="input" id="title" required></div><div class="form-group"><label>وصف المهمة</label><textarea class="textarea" id="description" required></textarea></div><div class="two-col"><div class="form-group"><label>الأولوية</label><select class="select" id="priority"><option value="low">منخفضة</option><option value="medium" selected>متوسطة</option><option value="high">عالية</option></select></div><div class="form-group"><label>تاريخ التسليم</label><input class="input" id="due" type="date" required></div></div><div class="form-group"><label>ملاحظات المشرف</label><textarea class="textarea" id="notes" placeholder="تعليمات أو ملاحظات خاصة بالمهمة"></textarea></div><div id="msg" class="message"></div><button class="btn" type="submit">إضافة المهمة</button></form></div><aside class="card"><div class="section-title"><span>خصوصية</span><h2>مهمة خاصة بمتدرب واحد</h2><p>يتم حفظ رقم المتدرب داخل المهمة، لذلك تظهر فقط لصاحبها في حساب المتدرب.</p></div></aside></section></main><script>
const TF={
 get(k,f=[]){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},
 set(k,v){localStorage.setItem(k,JSON.stringify(v))},
 users(){return this.get('tf_users',[])}, tasks(){return this.get('tf_tasks',[])}, reports(){return this.get('tf_reports',[])}, invites(){return this.get('tf_invites',[])},
 session(){const id=localStorage.getItem('tf_session');return this.users().find(u=>u.id===id)||null},
 id(p='id'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
 esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))},
 date(s){if(!s)return '-';return new Date(s+'T00:00:00').toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'})},
 logout(){localStorage.removeItem('tf_session');location.href='login.html'},
 require(role){const u=this.session();if(!u){location.href='login.html';return null}if(role&&u.role!==role){location.href=u.role==='supervisor'?'supervisor-dashboard.html':'trainee-dashboard.html';return null}return u}
};

const u=TF.require('supervisor');if(u){const trainees=TF.users().filter(x=>x.role==='trainee'&&x.supervisorId===u.id),sel=document.getElementById('trainee');sel.innerHTML='<option value="">اختر المتدرب</option>'+trainees.map(x=>`<option value="${x.id}">${TF.esc(x.name)} - ${TF.esc(x.email)}</option>`).join('');const q=new URLSearchParams(location.search).get('trainee');if(q&&trainees.some(x=>x.id===q))sel.value=q;if(!trainees.length){document.getElementById('msg').className='message error';document.getElementById('msg').textContent='لا يوجد متدربون مرتبطون بحسابك بعد.'}document.getElementById('form').onsubmit=e=>{e.preventDefault();const traineeId=sel.value;if(!trainees.some(x=>x.id===traineeId))return;let tasks=TF.tasks();tasks.push({id:TF.id('task'),supervisorId:u.id,traineeId,title:document.getElementById('title').value.trim(),description:document.getElementById('description').value.trim(),priority:document.getElementById('priority').value,dueDate:document.getElementById('due').value,supervisorNote:document.getElementById('notes').value.trim(),traineeNote:'',status:'pending',createdAt:new Date().toISOString(),completedAt:null});TF.set('tf_tasks',tasks);location.href='trainee-details.html?id='+traineeId}}</script></body></html>
