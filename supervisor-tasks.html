<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrainFlow | إدارة المهام</title>

    <link rel="stylesheet" href="supervisor-tasks.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >
</head>

<body>

    <main class="page-container">

        <!-- العودة -->

        <a href="supervisor-dashboard.html" class="back-button">
            <i class="fa-solid fa-arrow-right"></i>
            العودة للوحة المشرف
        </a>


        <!-- رأس الصفحة -->

        <header class="page-header">

            <div>
                <span class="page-label">
                    إدارة التدريب
                </span>

                <h1>
                    إدارة المهام
                </h1>

                <p>
                    إسناد المهام ومتابعة حالة تنفيذها
                </p>
            </div>

            <div class="header-icon">
                <i class="fa-solid fa-list-check"></i>
            </div>

        </header>


        <!-- اختيار المتدرب -->

        <section class="trainee-card">

            <div class="section-heading">

                <div>
                    <span>
                        المتدرب
                    </span>

                    <h2>
                        تحديد المتدرب
                    </h2>
                </div>

                <div class="section-icon">
                    <i class="fa-regular fa-user"></i>
                </div>

            </div>


            <div class="select-wrapper">

                <i class="fa-solid fa-chevron-down"></i>

                <select id="traineeSelect">

                    <option value="">
                        اختر المتدرب
                    </option>

                </select>

            </div>

        </section>


        <!-- إضافة مهمة -->

        <section class="form-card">

            <div class="section-heading">

                <div>
                    <span>
                        إسناد المهام
                    </span>

                    <h2>
                        إسناد مهمة جديدة
                    </h2>
                </div>

                <div class="section-icon">
                    <i class="fa-solid fa-plus"></i>
                </div>

            </div>


            <form id="taskForm">

                <!-- عنوان المهمة -->

                <div class="form-group">

                    <label for="taskTitle">
                        عنوان المهمة
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-clipboard"></i>

                        <input
                            type="text"
                            id="taskTitle"
                            placeholder="أدخل عنوان المهمة"
                            required
                        >

                    </div>

                </div>


                <!-- وصف المهمة -->

                <div class="form-group">

                    <label for="taskDescription">
                        وصف المهمة
                    </label>

                    <textarea
                        id="taskDescription"
                        placeholder="أدخل وصف المهمة ومتطلبات التنفيذ"
                        required
                    ></textarea>

                </div>


                <!-- الأولوية + التاريخ -->

                <div class="two-columns">

                    <div class="form-group">

                        <label for="priority">
                            الأولوية
                        </label>

                        <div class="select-wrapper">

                            <i class="fa-solid fa-chevron-down"></i>

                            <select id="priority" required>

                                <option value="">
                                    اختر الأولوية
                                </option>

                                <option value="low">
                                    منخفضة
                                </option>

                                <option value="medium">
                                    متوسطة
                                </option>

                                <option value="high">
                                    عالية
                                </option>

                            </select>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="dueDate">
                            تاريخ التسليم
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-regular fa-calendar"></i>

                            <input
                                type="date"
                                id="dueDate"
                                required
                            >

                        </div>

                    </div>

                </div>


                <!-- ملاحظات المشرف -->

                <div class="form-group">

                    <label for="supervisorNotes">
                        ملاحظات المشرف
                    </label>

                    <textarea
                        id="supervisorNotes"
                        class="notes-area"
                        placeholder="أضف ملاحظات أو تعليمات إضافية"
                    ></textarea>

                </div>


                <div id="message" class="message"></div>


                <button type="submit" class="assign-button">

                    <i class="fa-solid fa-plus"></i>

                    إسناد المهمة

                </button>

            </form>

        </section>


        <!-- المهام المسندة -->

        <section class="assigned-card">

            <div class="assigned-header">

                <div>

                    <span>
                        متابعة المهام
                    </span>

                    <h2>
                        المهام المسندة
                    </h2>

                    <p id="selectedTraineeText">
                        اختر متدربًا لعرض المهام المسندة إليه
                    </p>

                </div>


                <span id="tasksCount" class="tasks-count">
                    0
                </span>

            </div>


            <div id="tasksList" class="tasks-list">
            </div>


            <!-- لا توجد مهام -->

            <div id="emptyState" class="empty-state">

                <div class="empty-icon">
                    <i class="fa-regular fa-clipboard"></i>
                </div>

                <h3>
                    لا توجد مهام لعرضها
                </h3>

                <p>
                    اختر المتدرب لعرض المهام المسندة إليه
                </p>

            </div>

        </section>

    </main>


    <script>

        /* =====================================
           المستخدم الحالي
        ===================================== */

        const currentUser =
            JSON.parse(
                localStorage.getItem(
                    "trainflowCurrentUser"
                ) || "null"
            );


        if (
            !currentUser ||
            currentUser.role !== "supervisor"
        ) {

            window.location.href =
                "login.html";

        }



        /* =====================================
           العناصر
        ===================================== */

        const traineeSelect =
            document.getElementById(
                "traineeSelect"
            );


        const taskForm =
            document.getElementById(
                "taskForm"
            );


        const message =
            document.getElementById(
                "message"
            );


        const tasksList =
            document.getElementById(
                "tasksList"
            );


        const emptyState =
            document.getElementById(
                "emptyState"
            );


        const tasksCount =
            document.getElementById(
                "tasksCount"
            );


        const selectedTraineeText =
            document.getElementById(
                "selectedTraineeText"
            );



        /* =====================================
           المتدربون
        ===================================== */

        function getTrainees() {

            try {

                const data =
                    JSON.parse(
                        localStorage.getItem(
                            "trainflowTrainees"
                        ) || "[]"
                    );


                return Array.isArray(data)
                    ? data
                    : [];

            }

            catch (error) {

                return [];

            }

        }



        const myTrainees =
            getTrainees().filter(
                function (trainee) {

                    return (
                        String(
                            trainee.supervisorId
                        ) ===
                        String(
                            currentUser.id
                        )
                    );

                }
            );



        /* =====================================
           عرض المتدربين
        ===================================== */

        function loadTrainees() {

            traineeSelect.innerHTML = `

                <option value="">
                    اختر المتدرب
                </option>

            `;


            myTrainees.forEach(
                function (trainee) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        trainee.id;


                    option.textContent =
                        trainee.name;


                    traineeSelect.appendChild(
                        option
                    );

                }
            );


            if (
                myTrainees.length === 0
            ) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.disabled =
                    true;


                option.textContent =
                    "لا يوجد متدربون";


                traineeSelect.appendChild(
                    option
                );

            }

        }



        /* =====================================
           المتدرب المختار
        ===================================== */

        function getSelectedTrainee() {

            const traineeId =
                traineeSelect.value;


            if (!traineeId) {

                return null;

            }


            return myTrainees.find(
                function (trainee) {

                    return (
                        String(
                            trainee.id
                        ) ===
                        String(
                            traineeId
                        )
                    );

                }
            ) || null;

        }



        /* =====================================
           المهام
        ===================================== */

        function getTasks() {

            try {

                const data =
                    JSON.parse(
                        localStorage.getItem(
                            "trainflow_tasks"
                        ) || "[]"
                    );


                return Array.isArray(data)
                    ? data
                    : [];

            }

            catch (error) {

                return [];

            }

        }



        function saveTasks(tasks) {

            localStorage.setItem(
                "trainflow_tasks",
                JSON.stringify(tasks)
            );

        }



        /* =====================================
           عند اختيار المتدرب
        ===================================== */

        traineeSelect.addEventListener(
            "change",
            function () {

                clearMessage();

                renderTasks();

            }
        );



        /* =====================================
           إسناد مهمة
        ===================================== */

        taskForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                clearMessage();


                const trainee =
                    getSelectedTrainee();


                if (!trainee) {

                    showError(
                        "يرجى اختيار المتدرب."
                    );

                    return;

                }


                const title =
                    document
                        .getElementById(
                            "taskTitle"
                        )
                        .value
                        .trim();


                const description =
                    document
                        .getElementById(
                            "taskDescription"
                        )
                        .value
                        .trim();


                const priority =
                    document
                        .getElementById(
                            "priority"
                        )
                        .value;


                const dueDate =
                    document
                        .getElementById(
                            "dueDate"
                        )
                        .value;


                const supervisorNotes =
                    document
                        .getElementById(
                            "supervisorNotes"
                        )
                        .value
                        .trim();



                if (
                    !title ||
                    !description ||
                    !priority ||
                    !dueDate
                ) {

                    showError(
                        "يرجى تعبئة جميع الحقول المطلوبة."
                    );

                    return;

                }



                /* التحقق من التاريخ */

                const today =
                    new Date();


                today.setHours(
                    0,
                    0,
                    0,
                    0
                );


                const deadline =
                    new Date(
                        dueDate +
                        "T00:00:00"
                    );


                if (
                    deadline < today
                ) {

                    showError(
                        "تاريخ التسليم لا يمكن أن يكون في الماضي."
                    );

                    return;

                }



                const tasks =
                    getTasks();



                const newTask = {

                    id:
                        "TASK-" +
                        Date.now(),

                    traineeId:
                        trainee.id,

                    traineeName:
                        trainee.name,

                    traineeEmail:
                        trainee.email || "",

                    supervisorId:
                        currentUser.id,

                    supervisorName:
                        currentUser.name ||
                        "المشرف",

                    title:
                        title,

                    description:
                        description,

                    priority:
                        priority,

                    dueDate:
                        dueDate,

                    supervisorNotes:
                        supervisorNotes,

                    traineeNotes:
                        "",

                    status:
                        "new",

                    createdAt:
                        new Date()
                            .toISOString(),

                    startedAt:
                        null,

                    completedAt:
                        null

                };


                tasks.push(
                    newTask
                );


                saveTasks(
                    tasks
                );


                showSuccess(
                    "تم إسناد المهمة بنجاح."
                );


                /* تفريغ الحقول */

                document.getElementById(
                    "taskTitle"
                ).value = "";


                document.getElementById(
                    "taskDescription"
                ).value = "";


                document.getElementById(
                    "priority"
                ).value = "";


                document.getElementById(
                    "dueDate"
                ).value = "";


                document.getElementById(
                    "supervisorNotes"
                ).value = "";


                /* تحديث القائمة مباشرة */

                renderTasks();

            }
        );



        /* =====================================
           عرض مهام المتدرب المختار
        ===================================== */

        function renderTasks() {

            const trainee =
                getSelectedTrainee();


            tasksList.innerHTML =
                "";


            if (!trainee) {

                selectedTraineeText.textContent =
                    "اختر متدربًا لعرض المهام المسندة إليه";


                tasksCount.textContent =
                    "0";


                emptyState.style.display =
                    "flex";


                emptyState.querySelector(
                    "h3"
                ).textContent =
                    "لا توجد مهام لعرضها";


                emptyState.querySelector(
                    "p"
                ).textContent =
                    "اختر المتدرب لعرض المهام المسندة إليه";


                return;

            }



            selectedTraineeText.textContent =
                "المتدرب: " +
                trainee.name;



            /*
                نعرض فقط:
                1- مهام المتدرب المختار
                2- التي أسندها المشرف الحالي
            */

            const traineeTasks =
                getTasks().filter(
                    function (task) {

                        return (
                            String(
                                task.traineeId
                            ) ===
                            String(
                                trainee.id
                            ) &&

                            String(
                                task.supervisorId
                            ) ===
                            String(
                                currentUser.id
                            )
                        );

                    }
                );



            traineeTasks.sort(
                function (a, b) {

                    return (
                        new Date(
                            b.createdAt
                        ) -
                        new Date(
                            a.createdAt
                        )
                    );

                }
            );



            tasksCount.textContent =
                traineeTasks.length;



            if (
                traineeTasks.length === 0
            ) {

                emptyState.style.display =
                    "flex";


                emptyState.querySelector(
                    "h3"
                ).textContent =
                    "لا توجد مهام مسندة";


                emptyState.querySelector(
                    "p"
                ).textContent =
                    "لم يتم إسناد مهام لهذا المتدرب حتى الآن.";


                return;

            }



            emptyState.style.display =
                "none";



            traineeTasks.forEach(
                function (task) {

                    const status =
                        getStatusInfo(
                            task.status
                        );


                    const priority =
                        getPriorityInfo(
                            task.priority
                        );


                    const item =
                        document.createElement(
                            "article"
                        );


                    item.className =
                        "task-item";


                    item.innerHTML = `

                        <div class="task-main">

                            <div class="task-top">

                                <div>

                                    <span class="task-number">
                                        مهمة
                                    </span>

                                    <h3>
                                        ${escapeHTML(task.title)}
                                    </h3>

                                </div>


                                <span
                                    class="status-badge ${status.className}"
                                >
                                    ${status.text}
                                </span>

                            </div>


                            <p class="task-description">
                                ${escapeHTML(task.description)}
                            </p>


                            <div class="task-information">

                                <span>
                                    <i class="fa-regular fa-calendar"></i>

                                    تاريخ التسليم:
                                    ${formatDate(task.dueDate)}
                                </span>


                                <span
                                    class="priority-badge ${priority.className}"
                                >
                                    ${priority.text}
                                </span>

                            </div>


                            ${
                                task.traineeNotes
                                ? `
                                    <div class="trainee-note-alert">

                                        <i class="fa-regular fa-comment-dots"></i>

                                        توجد ملاحظة من المتدرب

                                    </div>
                                `
                                : ""
                            }

                        </div>


                        <button
                            type="button"
                            class="details-button"
                            onclick="openTask('${task.id}')"
                        >

                            عرض التفاصيل

                            <i class="fa-solid fa-chevron-left"></i>

                        </button>

                    `;


                    tasksList.appendChild(
                        item
                    );

                }
            );

        }



        /* =====================================
           فتح تفاصيل المهمة
        ===================================== */

        function openTask(taskId) {

            localStorage.setItem(
                "trainflow_selected_task",
                taskId
            );


            window.location.href =
                "task-details.html";

        }



        /* =====================================
           الحالة
        ===================================== */

        function getStatusInfo(status) {

            if (
                status === "completed"
            ) {

                return {

                    text:
                        "مكتملة",

                    className:
                        "completed"

                };

            }


            if (
                status === "progress"
            ) {

                return {

                    text:
                        "قيد التنفيذ",

                    className:
                        "progress"

                };

            }


            return {

                text:
                    "مهمة جديدة",

                className:
                    "new"

            };

        }



        /* =====================================
           الأولوية
        ===================================== */

        function getPriorityInfo(priority) {

            if (
                priority === "high"
            ) {

                return {

                    text:
                        "أولوية عالية",

                    className:
                        "high"

                };

            }


            if (
                priority === "medium"
            ) {

                return {

                    text:
                        "أولوية متوسطة",

                    className:
                        "medium"

                };

            }


            return {

                text:
                    "أولوية منخفضة",

                className:
                    "low"

            };

        }



        /* =====================================
           التاريخ
        ===================================== */

        function formatDate(date) {

            if (!date) {

                return "-";

            }


            return new Date(
                date +
                "T00:00:00"
            ).toLocaleDateString(
                "ar-SA"
            );

        }



        /* =====================================
           الرسائل
        ===================================== */

        function clearMessage() {

            message.textContent =
                "";


            message.className =
                "message";

        }


        function showError(text) {

            message.textContent =
                text;


            message.className =
                "message error";

        }


        function showSuccess(text) {

            message.textContent =
                text;


            message.className =
                "message success";

        }



        /* =====================================
           حماية النصوص
        ===================================== */

        function escapeHTML(value) {

            if (!value) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        /* =====================================
           التشغيل
        ===================================== */

        loadTrainees();

        renderTasks();

    </script>

</body>

</html>
