<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrainFlow | لوحة المشرف</title>

    <link rel="stylesheet" href="supervisor-dashboard.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >
</head>

<body>

    <header class="navbar">

        <a href="supervisor-dashboard.html" class="brand">

            <div class="brand-icon">
                <i class="fa-solid fa-layer-group"></i>
            </div>

            <div>
                <strong>TrainFlow</strong>
                <span>متابعة التدريب</span>
            </div>

        </a>


        <div class="navbar-actions">

            <div class="user-info">

                <div class="user-text">
                    <span>المشرف</span>
                    <strong id="supervisorName">-</strong>
                </div>

                <div class="user-avatar" id="supervisorAvatar">
                    م
                </div>

            </div>


            <button
                type="button"
                class="logout-button"
                id="logoutButton"
                title="تسجيل الخروج"
            >
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>

        </div>

    </header>


    <main class="page-container">

        <!-- أعلى الصفحة -->

        <section class="welcome-section">

            <div>

                <span class="page-label">
                    لوحة المشرف
                </span>

                <h1>
                    مرحباً،
                    <span id="welcomeName">-</span>
                </h1>

                <p>
                    تابع المتدربين المرتبطين بحسابك من هنا.
                </p>

            </div>


            <a
                href="add-trainee.html"
                class="add-trainee-button"
            >
                <i class="fa-solid fa-plus"></i>
                إضافة متدرب
            </a>

        </section>


        <!-- المعلومات الأساسية -->

        <section class="summary-grid">

            <!-- حالة المشرف -->

            <div class="summary-card office-card">

                <div class="summary-icon office-icon">
                    <i class="fa-solid fa-location-dot"></i>
                </div>


                <div class="summary-content">

                    <span>
                        حالة التواجد
                    </span>

                    <strong id="officeStatusText">
                        غير موجود في المكتب
                    </strong>

                </div>


                <label class="switch">

                    <input
                        type="checkbox"
                        id="officeStatusToggle"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <!-- عدد المتدربين -->

            <div class="summary-card">

                <div class="summary-icon trainees-icon">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>


                <div class="summary-content">

                    <span>
                        المتدربون
                    </span>

                    <strong>
                        <span id="traineesCount">0</span>
                        متدرب
                    </strong>

                </div>

            </div>

        </section>


        <!-- المتدربون -->

        <section class="trainees-section">

            <div class="section-header">

                <div>

                    <span>
                        المتدربون المرتبطون
                    </span>

                    <h2>
                        متدربيني
                    </h2>

                </div>


                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="ابحث بالاسم أو البريد..."
                    >

                </div>

            </div>


            <div
                class="trainees-list"
                id="traineesList"
            >
            </div>


            <!-- تظهر إذا ما فيه متدربين -->

            <div
                class="empty-state"
                id="emptyState"
            >

                <div class="empty-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>

                <h3>
                    لا يوجد متدربون حتى الآن
                </h3>

                <p>
                    أضف أول متدرب وحدد له كود الربط الخاص به.
                </p>

                <a href="add-trainee.html">
                    <i class="fa-solid fa-plus"></i>
                    إضافة متدرب
                </a>

            </div>

        </section>

    </main>


    <script>

        /*
            التأكد أن المستخدم مشرف
        */

        const currentUser =
            JSON.parse(
                localStorage.getItem(
                    "trainflow_current_user"
                )
            );


        if (
            !currentUser ||
            currentUser.role !== "supervisor"
        ) {

            window.location.href =
                "login.html";

        }


        /*
            قراءة بيانات المشرف الكاملة
        */

        let supervisors =
            JSON.parse(
                localStorage.getItem(
                    "trainflow_supervisors"
                )
            ) || [];


        let currentSupervisor =
            supervisors.find(
                function (supervisor) {

                    return (
                        supervisor.id ===
                        currentUser.id
                    );

                }
            );


        if (!currentSupervisor) {

            localStorage.removeItem(
                "trainflow_current_user"
            );

            window.location.href =
                "login.html";

        }


        /*
            عرض بيانات المشرف
        */

        document.getElementById(
            "supervisorName"
        ).innerText =
            currentSupervisor.name;


        document.getElementById(
            "welcomeName"
        ).innerText =
            currentSupervisor.name;


        document.getElementById(
            "supervisorAvatar"
        ).innerText =
            getFirstLetter(
                currentSupervisor.name
            );


        /*
            حالة وجود المشرف في المكتب
        */

        const officeStatusToggle =
            document.getElementById(
                "officeStatusToggle"
            );


        const officeStatusText =
            document.getElementById(
                "officeStatusText"
            );


        officeStatusToggle.checked =
            currentSupervisor.officeStatus === true;


        updateOfficeStatusText();


        officeStatusToggle.addEventListener(
            "change",
            function () {

                currentSupervisor.officeStatus =
                    officeStatusToggle.checked;


                supervisors =
                    supervisors.map(
                        function (supervisor) {

                            if (
                                supervisor.id ===
                                currentSupervisor.id
                            ) {

                                return currentSupervisor;

                            }

                            return supervisor;

                        }
                    );


                localStorage.setItem(
                    "trainflow_supervisors",
                    JSON.stringify(
                        supervisors
                    )
                );


                updateOfficeStatusText();

            }
        );


        function updateOfficeStatusText() {

            if (
                currentSupervisor.officeStatus
            ) {

                officeStatusText.innerText =
                    "موجود في المكتب";

                officeStatusText.className =
                    "available";

            } else {

                officeStatusText.innerText =
                    "غير موجود في المكتب";

                officeStatusText.className =
                    "unavailable";

            }

        }


        /*
            تحميل متدربي هذا المشرف فقط
        */

        const traineesList =
            document.getElementById(
                "traineesList"
            );


        const emptyState =
            document.getElementById(
                "emptyState"
            );


        const searchInput =
            document.getElementById(
                "searchInput"
            );


        function getMyTrainees() {

            const allTrainees =
                JSON.parse(
                    localStorage.getItem(
                        "trainflow_trainees"
                    )
                ) || [];


            return allTrainees.filter(
                function (trainee) {

                    return (
                        trainee.supervisorId ===
                        currentSupervisor.id
                    );

                }
            );

        }


        function displayTrainees() {

            const myTrainees =
                getMyTrainees();


            document.getElementById(
                "traineesCount"
            ).innerText =
                myTrainees.length;


            const searchValue =
                searchInput
                    .value
                    .trim()
                    .toLowerCase();


            const filteredTrainees =
                myTrainees.filter(
                    function (trainee) {

                        const name =
                            (
                                trainee.name || ""
                            ).toLowerCase();


                        const email =
                            (
                                trainee.email || ""
                            ).toLowerCase();


                        return (
                            name.includes(
                                searchValue
                            ) ||
                            email.includes(
                                searchValue
                            )
                        );

                    }
                );


            traineesList.innerHTML = "";


            if (
                myTrainees.length === 0
            ) {

                emptyState.style.display =
                    "flex";

                traineesList.style.display =
                    "none";

                return;

            }


            emptyState.style.display =
                "none";

            traineesList.style.display =
                "grid";


            if (
                filteredTrainees.length === 0
            ) {

                traineesList.innerHTML = `

                    <div class="no-results">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        <span>
                            لا توجد نتائج مطابقة للبحث.
                        </span>

                    </div>

                `;

                return;

            }


            filteredTrainees.forEach(
                function (trainee) {

                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "trainee-card";


                    const accountStatus =
                        trainee.accountCreated
                            ? `
                                <span class="account-status active">
                                    <i class="fa-solid fa-check"></i>
                                    مرتبط
                                </span>
                              `
                            : `
                                <span class="account-status waiting">
                                    بانتظار التسجيل
                                </span>
                              `;


                    card.innerHTML = `

                        <div class="trainee-top">

                            <div class="trainee-avatar">
                                ${escapeHTML(
                                    getFirstLetter(
                                        trainee.name
                                    )
                                )}
                            </div>


                            ${accountStatus}

                        </div>


                        <div class="trainee-info">

                            <h3>
                                ${escapeHTML(
                                    trainee.name
                                )}
                            </h3>

                            <p>
                                ${escapeHTML(
                                    trainee.email
                                )}
                            </p>

                        </div>


                        <button
                            type="button"
                            class="open-trainee-button"
                            data-id="${escapeHTML(
                                trainee.id
                            )}"
                        >
                            فتح ملف المتدرب

                            <i class="fa-solid fa-arrow-left"></i>
                        </button>

                    `;


                    traineesList.appendChild(
                        card
                    );

                }
            );


            document
                .querySelectorAll(
                    ".open-trainee-button"
                )
                .forEach(
                    function (button) {

                        button.addEventListener(
                            "click",
                            function () {

                                openTrainee(
                                    button.dataset.id
                                );

                            }
                        );

                    }
                );

        }


        /*
            فتح متدرب معين
        */

        function openTrainee(
            traineeId
        ) {

            localStorage.setItem(
                "trainflow_selected_trainee",
                traineeId
            );


            window.location.href =
                "trainee-details.html";

        }


        /*
            البحث
        */

        searchInput.addEventListener(
            "input",
            displayTrainees
        );


        /*
            تسجيل الخروج
        */

        document.getElementById(
            "logoutButton"
        ).addEventListener(
            "click",
            function () {

                localStorage.removeItem(
                    "trainflow_current_user"
                );


                localStorage.removeItem(
                    "trainflow_selected_trainee"
                );


                window.location.href =
                    "login.html";

            }
        );


        function getFirstLetter(
            value
        ) {

            if (!value) {
                return "م";
            }

            return value
                .trim()
                .charAt(0);

        }


        function escapeHTML(
            value
        ) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value || "";

            return div.innerHTML;

        }


        displayTrainees();

    </script>

</body>

</html>
