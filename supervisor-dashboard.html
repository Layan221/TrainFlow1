<div class="add-trainee-section">

    <h2>إضافة متدرب</h2>

    <p>أدخل بيانات المتدرب وحدد له كود الدخول الخاص به.</p>

    <form id="addTraineeForm">

        <div class="form-group">
            <label for="traineeName">اسم المتدرب</label>

            <input
                type="text"
                id="traineeName"
                placeholder="أدخل اسم المتدرب"
                required
            >
        </div>


        <div class="form-group">
            <label for="traineeEmail">البريد الإلكتروني</label>

            <input
                type="email"
                id="traineeEmail"
                placeholder="name@example.com"
                required
            >
        </div>


        <div class="form-group">
            <label for="traineeCode">كود المتدرب</label>

            <input
                type="text"
                id="traineeCode"
                placeholder="مثال: 1025"
                required
            >

            <small>
                اختر كودًا خاصًا للمتدرب، وسيستخدمه عند تسجيل الدخول.
            </small>
        </div>


        <div
            id="traineeMessage"
            class="form-message">
        </div>


        <button
            type="submit"
            class="add-trainee-btn">

            <i class="fa-solid fa-user-plus"></i>

            إضافة المتدرب

        </button>

    </form>

</div>
