<!-- عنوان الصفحة -->
<div class="form-header">

    <div class="top-icon">
        <i class="fa-solid fa-user-plus"></i>
    </div>

    <span class="welcome">
        أهلاً بك في TrainFlow
    </span>

    <h1>إنشاء حساب مشرف</h1>

    <p>
        أدخل بياناتك لإنشاء حساب المشرف والبدء بإدارة المتدربين.
    </p>

</div>


<form id="registerForm">

    <!-- الاسم الكامل -->
    <div class="form-group">

        <label for="fullName">
            الاسم الكامل
        </label>

        <div class="input-box">

            <i class="fa-regular fa-user input-icon"></i>

            <input
                type="text"
                id="fullName"
                placeholder="أدخل اسمك الكامل"
                required
            >

        </div>

    </div>


    <!-- البريد الإلكتروني -->
    <div class="form-group">

        <label for="email">
            البريد الإلكتروني
        </label>

        <div class="input-box">

            <i class="fa-regular fa-envelope input-icon"></i>

            <input
                type="email"
                id="email"
                placeholder="name@example.com"
                required
            >

        </div>

    </div>


    <!-- كود المنشأة -->
    <div class="form-group">

        <label for="organizationCode">
            كود المنشأة
        </label>

        <div class="input-box">

            <i class="fa-solid fa-building input-icon"></i>

            <input
                type="text"
                id="organizationCode"
                placeholder="أدخل كود المنشأة"
                required
            >

        </div>

        <small class="help-text">
            يستخدم للتحقق من صلاحية إنشاء حساب المشرف.
        </small>

    </div>


    <!-- كلمة المرور -->
    <div class="form-group">

        <label for="password">
            كلمة المرور
        </label>

        <div class="input-box">

            <i class="fa-solid fa-lock input-icon"></i>

            <input
                type="password"
                id="password"
                placeholder="أنشئ كلمة مرور"
                required
            >

            <button
                type="button"
                class="show-password"
                id="showPassword"
            >
                <i class="fa-regular fa-eye"></i>
            </button>

        </div>

    </div>


    <!-- تأكيد كلمة المرور -->
    <div class="form-group">

        <label for="confirmPassword">
            تأكيد كلمة المرور
        </label>

        <div class="input-box">

            <i class="fa-solid fa-shield-halved input-icon"></i>

            <input
                type="password"
                id="confirmPassword"
                placeholder="أعد كتابة كلمة المرور"
                required
            >

        </div>

    </div>


    <div id="formMessage" class="form-message"></div>


    <button type="submit" class="register-btn">

        <span>إنشاء حساب المشرف</span>

        <i class="fa-solid fa-arrow-left"></i>

    </button>

</form>


<!-- لديه حساب -->
<div class="login-link">

    <span>لديك حساب بالفعل؟</span>

    <a href="login.html">
        تسجيل الدخول
    </a>

</div>
