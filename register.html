<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TrainFlow | إنشاء حساب</title><link rel="stylesheet" href="register.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div><main class="container auth"><section class="auth-side"><div class="brand"><div class="brand-icon"><i class="fa-solid fa-user-graduate"></i></div><div><h1>TrainFlow</h1><small>Training Management System</small></div></div><h2>ابدأ تدريبك بحساب مرتبط بشكل صحيح</h2><p>المشرف يحتاج كود الاعتماد <b>5566</b>. بعد التسجيل يحصل على كود ربط خاص يعطيه لمتدربيه. المتدرب يحتاج كود مشرفه حتى يرتبط به.</p></section><section class="card auth-card"><a class="ghost-btn" href="login.html"><i class="fa-solid fa-arrow-right"></i> العودة لتسجيل الدخول</a><div class="section-title" style="margin-top:18px"><span>إنشاء حساب</span><h2>بيانات الحساب</h2></div><div class="role-tabs"><button id="traineeBtn" class="role-btn active" type="button">متدرب</button><button id="supervisorBtn" class="role-btn" type="button">مشرف</button></div><form id="form"><div class="form-group"><label>الاسم الكامل</label><input class="input" id="name" required></div><div class="form-group"><label>البريد الإلكتروني</label><input class="input" id="email" type="email" required></div><div class="form-group"><label>كلمة المرور</label><input class="input" id="password" type="password" minlength="6" required></div><div class="form-group"><label>تأكيد كلمة المرور</label><input class="input" id="confirm" type="password" required></div><div id="supervisorFields" class="hidden"><div class="form-group"><label>كود اعتماد المشرف</label><input class="input" id="supervisorMasterCode" inputmode="numeric" placeholder="أدخل الكود"></div></div><div id="traineeFields"><div class="form-group"><label>كود ربط المشرف</label><input class="input" id="linkCode" placeholder="مثال TF-AB12"><small>خذه من مشرفك. بدون الكود لا يمكن إنشاء حساب متدرب.</small></div><div class="form-group"><label>مجال التدريب</label><input class="input" id="field" placeholder="مثال: تطوير الويب"></div></div><div id="msg" class="message"></div><button class="btn" style="width:100%" type="submit">إنشاء الحساب</button></form></section></main><script>
const TF={
 get(k,f=[]){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},
 set(k,v){localStorage.setItem(k,JSON.stringify(v))},
 users(){return this.get('tf_users',[])}, tasks(){return this.get('tf_tasks',[])}, reports(){return this.get('tf_reports',[])}, invites(){return this.get('tf_invites',[])},
 session(){const id=localStorage.getItem('tf_session');return this.users().find(u=>u.id===id)||null},
 id(p='id'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
 esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))},
 date(s){if(!s)return '-';return new Date(s+'T00:00:00').toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'})},
 logout(){localStorage.removeItem('tf_session');location.href='login.html'},
 require(role){const u=this.session();if(!u){location.href='login.html';return null}if(role&&u.role!==role){location.href=u.role==='supervisor'?'supervisor-dashboard.html':'trainee-dashboard.html';return null}return u}
};

let role='trainee';const t=document.getElementById('traineeBtn'),s=document.getElementById('supervisorBtn');function setRole(r){role=r;t.classList.toggle('active',r==='trainee');s.classList.toggle('active',r==='supervisor');document.getElementById('traineeFields').classList.toggle('hidden',r!=='trainee');document.getElementById('supervisorFields').classList.toggle('hidden',r!=='supervisor')}t.onclick=()=>setRole('trainee');s.onclick=()=>setRole('supervisor');document.getElementById('form').onsubmit=e=>{e.preventDefault();const msg=document.getElementById('msg');msg.className='message';const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),pass=document.getElementById('password').value,confirm=document.getElementById('confirm').value;let users=TF.users();if(pass!==confirm){msg.classList.add('error');msg.textContent='كلمتا المرور غير متطابقتين';return}if(users.some(u=>u.email===email)){msg.classList.add('error');msg.textContent='البريد مسجل مسبقًا';return}let user={id:TF.id('u'),name,email,password:pass,role,createdAt:new Date().toISOString()};if(role==='supervisor'){if(document.getElementById('supervisorMasterCode').value.trim()!=='5566'){msg.classList.add('error');msg.textContent='كود اعتماد المشرف غير صحيح';return}let code;do{code='TF-'+Math.random().toString(36).slice(2,6).toUpperCase()}while(users.some(u=>u.supervisorLinkCode===code));user.supervisorLinkCode=code}else{const code=document.getElementById('linkCode').value.trim().toUpperCase();const sup=users.find(u=>u.role==='supervisor'&&u.supervisorLinkCode===code);if(!sup){msg.classList.add('error');msg.textContent='كود ربط المشرف غير صحيح';return}user.supervisorId=sup.id;user.trainingField=document.getElementById('field').value.trim();const invites=TF.invites();const inv=invites.find(i=>i.email===email&&i.supervisorId===sup.id);if(inv){user.trainingField=user.trainingField||inv.trainingField||'';user.startDate=inv.startDate||'';user.endDate=inv.endDate||''}}users.push(user);TF.set('tf_users',users);TF.set('tf_session',user.id);location.href=role==='supervisor'?'supervisor-dashboard.html':'trainee-dashboard.html'}</script></body></html>
