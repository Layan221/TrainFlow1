<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        TrainFlow | إنشاء حساب مشرف
    </title>

    <link
        rel="stylesheet"
        href="register.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <a
                href="index.html"
                class="back-button"
            >
                <i class="fa-solid fa-arrow-right"></i>
                الرجوع
            </a>


            <div class="auth-header">

                <div class="brand-icon">
                    <i class="fa-solid fa-user-tie"></i>
                </div>

                <span>
                    TrainFlow
                </span>

                <h1>
                    إنشاء حساب مشرف
                </h1>

                <p>
                    أدخل بياناتك لإنشاء حساب جديد.
                </p>

            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="fullName">
                        الاسم الكامل
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="أدخل الاسم الكامل"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="example@email.com"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="أنشئ كلمة مرور"
                            minlength="6"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        تأكيد كلمة المرور
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="أعد كتابة كلمة المرور"
                            minlength="6"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="organizationCode">
                        كود اعتماد الجهة
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-shield-halved"></i>

                        <input
                            type="password"
                            id="organizationCode"
                            placeholder="أدخل كود اعتماد الجهة"
                            required
                        >

                    </div>

                </div>


                <p id="message"></p>


                <button
                    type="submit"
                    class="submit-button"
                >
                    إنشاء الحساب
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

            </form>


            <div class="register-link">

                <span>
                    لديك حساب بالفعل؟
                </span>

                <a href="login.html">
                    تسجيل الدخول
                </a>

            </div>

        </section>

    </main>


    <script>

        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");


        registerForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const fullName =
                    document
                        .getElementById("fullName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                const organizationCode =
                    document
                        .getElementById("organizationCode")
                        .value
                        .trim();


                if (password !== confirmPassword) {

                    showError(
                        "كلمتا المرور غير متطابقتين"
                    );

                    return;

                }


                if (organizationCode !== "5566") {

                    showError(
                        "كود اعتماد الجهة غير صحيح"
                    );

                    return;

                }


                let supervisors =
                    JSON.parse(
                        localStorage.getItem(
                            "trainflow_supervisors"
                        )
                    ) || [];


                const emailExists =
                    supervisors.some(
                        function (supervisor) {

                            return (
                                supervisor.email
                                    .toLowerCase() === email
                            );

                        }
                    );


                if (emailExists) {

                    showError(
                        "يوجد حساب مسجل بهذا البريد الإلكتروني"
                    );

                    return;

                }


                const supervisor = {

                    id:
                        "SUP-" +
                        Date.now(),

                    name:
                        fullName,

                    email:
                        email,

                    password:
                        password,

                    createdAt:
                        new Date().toISOString()

                };


                supervisors.push(supervisor);


                localStorage.setItem(
                    "trainflow_supervisors",
                    JSON.stringify(supervisors)
                );


                localStorage.setItem(
                    "trainflow_current_user",
                    JSON.stringify({
                        id: supervisor.id,
                        name: supervisor.name,
                        email: supervisor.email,
                        role: "supervisor"
                    })
                );


                message.className =
                    "success-message";

                message.innerText =
                    "تم إنشاء الحساب بنجاح";


                setTimeout(function () {

                    window.location.href =
                        "supervisor-dashboard.html";

                }, 600);

            }
        );


        function showError(text) {

            message.className =
                "error-message";

            message.innerText =
                text;

        }

    </script>

</body>

</html>
