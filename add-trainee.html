<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TrainFlow | إضافة متدرب</title><link rel="stylesheet" href="add-trainee.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div><main class="container"><a class="ghost-btn" href="supervisor-dashboard.html"><i class="fa-solid fa-arrow-right"></i> العودة للوحة التحكم</a><div class="section-title" style="margin-top:20px"><span>إدارة المتدربين</span><h2>إضافة متدرب</h2><p>يمكنك إرسال دعوة مسبقة بالبريد، والمتدرب سيظل بحاجة إلى كود الربط الخاص بك عند التسجيل.</p></div><section class="dash-grid"><div class="card"><form id="form"><div class="form-group"><label>اسم المتدرب</label><input class="input" id="name" required></div><div class="form-group"><label>البريد الإلكتروني</label><input class="input" id="email" type="email" required></div><div class="form-group"><label>مجال التدريب</label><input class="input" id="field"></div><div class="two-col"><div class="form-group"><label>بداية التدريب</label><input class="input" id="start" type="date"></div><div class="form-group"><label>نهاية التدريب</label><input class="input" id="end" type="date"></div></div><div class="form-group"><label>ملاحظات</label><textarea class="textarea" id="notes"></textarea></div><div id="msg" class="message"></div><button class="btn" type="submit">حفظ الدعوة</button></form></div><aside class="card"><div class="section-title"><span>كود الربط</span><h2>أرسله للمتدرب</h2></div><div id="code" class="code"></div><button id="copy" class="ghost-btn" style="width:100%">نسخ الكود</button><p class="muted" style="margin-top:12px;line-height:1.8">عند تسجيل المتدرب بهذا الكود سيتم ربطه بك تلقائيًا، ولن تظهر له مهام أي متدرب آخر.</p></aside></section></main><script>
const TF={
 get(k,f=[]){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},
 set(k,v){localStorage.setItem(k,JSON.stringify(v))},
 users(){return this.get('tf_users',[])}, tasks(){return this.get('tf_tasks',[])}, reports(){return this.get('tf_reports',[])}, invites(){return this.get('tf_invites',[])},
 session(){const id=localStorage.getItem('tf_session');return this.users().find(u=>u.id===id)||null},
 id(p='id'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
 esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))},
 date(s){if(!s)return '-';return new Date(s+'T00:00:00').toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'})},
 logout(){localStorage.removeItem('tf_session');location.href='login.html'},
 require(role){const u=this.session();if(!u){location.href='login.html';return null}if(role&&u.role!==role){location.href=u.role==='supervisor'?'supervisor-dashboard.html':'trainee-dashboard.html';return null}return u}
};

const u=TF.require('supervisor');if(u){document.getElementById('code').textContent=u.supervisorLinkCode;document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(u.supervisorLinkCode);document.getElementById('copy').textContent='تم النسخ'};document.getElementById('form').onsubmit=e=>{e.preventDefault();let inv=TF.invites();const email=document.getElementById('email').value.trim().toLowerCase();const item={id:TF.id('inv'),supervisorId:u.id,name:document.getElementById('name').value.trim(),email,trainingField:document.getElementById('field').value.trim(),startDate:document.getElementById('start').value,endDate:document.getElementById('end').value,notes:document.getElementById('notes').value.trim(),createdAt:new Date().toISOString()};inv=inv.filter(x=>!(x.supervisorId===u.id&&x.email===email));inv.push(item);TF.set('tf_invites',inv);const msg=document.getElementById('msg');msg.className='message success';msg.textContent='تم حفظ الدعوة. أعطِ المتدرب كود الربط الظاهر بجانب النموذج.';e.target.reset()}}</script></body></html>
