<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TrainFlow | تفاصيل المهمة</title><link rel="stylesheet" href="task-details.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div><main class="container"><button class="ghost-btn" onclick="history.back()"><i class="fa-solid fa-arrow-right"></i> رجوع</button><div id="content" style="margin-top:20px"></div></main><script>
const TF={
 get(k,f=[]){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},
 set(k,v){localStorage.setItem(k,JSON.stringify(v))},
 users(){return this.get('tf_users',[])}, tasks(){return this.get('tf_tasks',[])}, reports(){return this.get('tf_reports',[])}, invites(){return this.get('tf_invites',[])},
 session(){const id=localStorage.getItem('tf_session');return this.users().find(u=>u.id===id)||null},
 id(p='id'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
 esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))},
 date(s){if(!s)return '-';return new Date(s+'T00:00:00').toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'})},
 logout(){localStorage.removeItem('tf_session');location.href='login.html'},
 require(role){const u=this.session();if(!u){location.href='login.html';return null}if(role&&u.role!==role){location.href=u.role==='supervisor'?'supervisor-dashboard.html':'trainee-dashboard.html';return null}return u}
};

const u=TF.require();if(u){const id=new URLSearchParams(location.search).get('id'),task=TF.tasks().find(t=>t.id===id);const allowed=task&&(u.role==='trainee'?task.traineeId===u.id:task.supervisorId===u.id);if(!allowed){document.getElementById('content').innerHTML='<div class="card empty"><h3>لا يمكنك الوصول لهذه المهمة</h3></div>'}else{const trainee=TF.users().find(x=>x.id===task.traineeId);document.getElementById('content').innerHTML=`<div class="section-title"><span>تفاصيل المهمة</span><h2>${TF.esc(task.title)}</h2></div><section class="dash-grid"><div><div class="card"><p class="pre">${TF.esc(task.description)}</p><div class="feature-grid" style="margin-top:18px"><div><span class="muted">المتدرب</span><h3>${TF.esc(trainee?.name||'')}</h3></div><div><span class="muted">التسليم</span><h3>${TF.date(task.dueDate)}</h3></div><div><span class="muted">الأولوية</span><h3>${task.priority==='high'?'عالية':task.priority==='medium'?'متوسطة':'منخفضة'}</h3></div></div></div><div class="card" style="margin-top:16px"><div class="section-title"><span>ملاحظات المشرف</span><h2>تعليمات المهمة</h2></div><p class="pre">${TF.esc(task.supervisorNote||'لا توجد ملاحظات من المشرف.')}</p></div>${u.role==='trainee'?`<div class="card" style="margin-top:16px"><div class="section-title"><span>تحديثي</span><h2>إنجاز المهمة وملاحظتي</h2></div><label class="check-wrap" style="margin-bottom:14px"><input id="doneCheck" type="checkbox" ${task.status==='completed'?'checked':''}> تم إنجاز المهمة</label><textarea id="traineeNote" class="textarea" placeholder="اكتب ملاحظتك عن المهمة...">${TF.esc(task.traineeNote||'')}</textarea><div id="msg" class="message"></div><button id="saveBtn" class="btn">حفظ التحديث</button></div>`:''}</div><aside><div class="card"><div class="section-title"><span>الحالة</span><h2 id="statusLabel">${task.status==='completed'?'مكتملة':task.status==='progress'?'قيد التنفيذ':'لم تبدأ'}</h2></div><span class="badge ${task.status}">${task.status==='completed'?'مكتملة':task.status==='progress'?'قيد التنفيذ':'لم تبدأ'}</span></div></aside></section>`;if(u.role==='trainee'){document.getElementById('saveBtn').onclick=()=>{let all=TF.tasks(),i=all.findIndex(t=>t.id===task.id&&t.traineeId===u.id);all[i].traineeNote=document.getElementById('traineeNote').value.trim();const done=document.getElementById('doneCheck').checked;all[i].status=done?'completed':'progress';all[i].completedAt=done?(all[i].completedAt||new Date().toISOString()):null;TF.set('tf_tasks',all);document.getElementById('msg').className='message success';document.getElementById('msg').textContent='تم حفظ تحديث المهمة';document.getElementById('statusLabel').textContent=done?'مكتملة':'قيد التنفيذ'}}}}</script></body></html>
