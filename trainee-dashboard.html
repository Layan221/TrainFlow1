<script>

/* =====================================================
   مفاتيح TrainFlow الموحدة
===================================================== */

const CURRENT_USER_KEY = "trainflow_current_user";
const TRAINEES_KEY = "trainflow_trainees";
const TASKS_KEY = "trainflow_tasks";
const REPORTS_KEY = "trainflow_reports";


/* =====================================================
   قراءة البيانات
===================================================== */

function readArray(key) {

    try {

        const data = JSON.parse(
            localStorage.getItem(key) || "[]"
        );

        return Array.isArray(data)
            ? data
            : [];

    } catch (error) {

        console.error(
            "خطأ في قراءة:",
            key,
            error
        );

        return [];
    }
}


function normalize(value) {

    return String(value ?? "")
        .trim()
        .toLowerCase();
}


/* =====================================================
   المستخدم الحالي
===================================================== */

let currentTrainee = null;

try {

    currentTrainee = JSON.parse(
        localStorage.getItem(
            CURRENT_USER_KEY
        ) || "null"
    );

} catch (error) {

    console.error(
        "خطأ في قراءة المستخدم الحالي",
        error
    );
}


/* =====================================================
   حماية الصفحة
===================================================== */

if (
    !currentTrainee ||
    currentTrainee.role !== "trainee"
) {

    window.location.replace(
        "login.html"
    );
}


/* =====================================================
   عناصر الصفحة
===================================================== */

const headerTraineeName =
    document.getElementById(
        "headerTraineeName"
    );

const welcomeTraineeName =
    document.getElementById(
        "welcomeTraineeName"
    );

const supervisorNameElement =
    document.getElementById(
        "supervisorName"
    );

const supervisorStatusElement =
    document.getElementById(
        "supervisorStatus"
    );

const supervisorStatusDot =
    document.getElementById(
        "supervisorStatusDot"
    );

const totalTasksElement =
    document.getElementById(
        "totalTasks"
    );

const completedTasksElement =
    document.getElementById(
        "completedTasks"
    );

const totalReportsElement =
    document.getElementById(
        "totalReports"
    );

const tasksList =
    document.getElementById(
        "tasksList"
    );


/* =====================================================
   بيانات المتدرب الأصلية
===================================================== */

function getOriginalTrainee() {

    const trainees =
        readArray(TRAINEES_KEY);


    /* أولاً: ID */

    if (
        currentTrainee.id !== undefined &&
        currentTrainee.id !== null
    ) {

        const traineeById =
            trainees.find(
                trainee =>

                    String(
                        trainee.id
                    ) ===
                    String(
                        currentTrainee.id
                    )
            );


        if (traineeById) {

            return traineeById;
        }
    }


    /* ثانياً: البريد */

    if (currentTrainee.email) {

        const traineeByEmail =
            trainees.find(
                trainee =>

                    normalize(
                        trainee.email
                    ) ===
                    normalize(
                        currentTrainee.email
                    )
            );


        if (traineeByEmail) {

            return traineeByEmail;
        }
    }


    /* احتياط */

    return currentTrainee;
}


/* =====================================================
   اسم المتدرب
===================================================== */

function loadTraineeName() {

    const trainee =
        getOriginalTrainee();


    const name =
        trainee.name ||
        trainee.fullName ||
        currentTrainee.name ||
        currentTrainee.fullName ||
        "المتدرب";


    headerTraineeName.textContent =
        name;


    welcomeTraineeName.textContent =
        name;
}


/* =====================================================
   البحث عن حساب المشرف
===================================================== */

function getAllSupervisors() {

    const possibleKeys = [

        "trainflow_users",
        "trainflow_supervisors",

        /* احتياط للبيانات القديمة */

        "trainflowUsers",
        "trainflowSupervisors",
        "supervisors",
        "users"
    ];


    let supervisors = [];


    possibleKeys.forEach(
        key => {

            supervisors.push(
                ...readArray(key)
            );
        }
    );


    return supervisors;
}


/* =====================================================
   المشرف المرتبط
===================================================== */

function findLinkedSupervisor() {

    const trainee =
        getOriginalTrainee();


    const supervisorId =

        trainee.supervisorId ||

        trainee.supervisorID ||

        trainee.supervisor_id ||

        trainee.linkedSupervisorId ||

        currentTrainee.supervisorId ||

        null;


    const supervisorEmail =

        trainee.supervisorEmail ||

        trainee.linkedSupervisorEmail ||

        currentTrainee.supervisorEmail ||

        null;


    const supervisors =
        getAllSupervisors();


    /* البحث بالـ ID */

    if (supervisorId) {

        const supervisor =
            supervisors.find(
                user => {

                    const id =

                        user.id ||

                        user.userId ||

                        user.supervisorId;


                    return (

                        id !== undefined &&

                        String(id) ===
                        String(supervisorId)
                    );
                }
            );


        if (supervisor) {

            return {

                linked: true,

                id:
                    supervisor.id ||
                    supervisor.userId ||
                    supervisorId,

                supervisor:
                    supervisor
            };
        }


        /*
            حتى لو حساب المشرف
            غير موجود في المصفوفة،
            الربط نفسه موجود.
        */

        return {

            linked: true,

            id:
                supervisorId,

            supervisor:
                null
        };
    }


    /* البحث بالبريد */

    if (supervisorEmail) {

        const supervisor =
            supervisors.find(
                user =>

                    normalize(
                        user.email
                    ) ===
                    normalize(
                        supervisorEmail
                    )
            );


        if (supervisor) {

            return {

                linked: true,

                id:
                    supervisor.id ||
                    supervisor.userId ||
                    supervisorEmail,

                supervisor:
                    supervisor
            };
        }
    }


    return {

        linked: false,

        id: null,

        supervisor: null
    };
}


/* =====================================================
   اسم المشرف
===================================================== */

function getSupervisorName(
    supervisor
) {

    if (!supervisor) {

        return null;
    }


    return (

        supervisor.name ||

        supervisor.fullName ||

        supervisor.displayName ||

        supervisor.username ||

        null
    );
}


/* =====================================================
   حالة المشرف
===================================================== */

function getSupervisorPresence(
    supervisorId,
    supervisor
) {

    const keys = [

        "trainflowPresence_" +
        supervisorId,

        "supervisorPresence_" +
        supervisorId,

        "presence_" +
        supervisorId
    ];


    for (const key of keys) {

        const value =
            localStorage.getItem(key);


        if (
            value !== null &&
            value !== ""
        ) {

            return value;
        }
    }


    if (supervisor) {

        return (

            supervisor.presence ||

            supervisor.officeStatus ||

            supervisor.status ||

            supervisor.availability ||

            null
        );
    }


    return null;
}


function isSupervisorPresent(value) {

    const status =
        normalize(value);


    return [

        "present",
        "available",
        "online",
        "office",
        "in-office",
        "inoffice",
        "موجود",
        "موجود في المكتب",
        "true",
        "1"

    ].includes(status);
}


function isSupervisorAway(value) {

    const status =
        normalize(value);


    return [

        "away",
        "offline",
        "absent",
        "out",
        "غير موجود",
        "غير موجود في المكتب",
        "false",
        "0"

    ].includes(status);
}


/* =====================================================
   عرض بيانات المشرف
===================================================== */

function loadSupervisorInformation() {

    const link =
        findLinkedSupervisor();


    if (!link.linked) {

        supervisorNameElement.textContent =
            "غير مرتبط بمشرف";


        supervisorStatusElement.textContent =
            "لا يوجد مشرف مرتبط بالحساب";


        supervisorStatusDot.className =
            "status-dot offline";


        return;
    }


    const supervisorName =
        getSupervisorName(
            link.supervisor
        );


    if (supervisorName) {

        supervisorNameElement.textContent =
            supervisorName;

    } else {

        /*
            يوجد ربط لكن بيانات
            حساب المشرف غير متاحة.
        */

        const trainee =
            getOriginalTrainee();


        supervisorNameElement.textContent =

            trainee.supervisorName ||

            currentTrainee.supervisorName ||

            "مشرف التدريب";
    }


    const presence =
        getSupervisorPresence(
            link.id,
            link.supervisor
        );


    if (
        isSupervisorPresent(
            presence
        )
    ) {

        supervisorStatusElement.textContent =
            "موجود في المكتب";


        supervisorStatusDot.className =
            "status-dot online";
    }

    else if (
        isSupervisorAway(
            presence
        )
    ) {

        supervisorStatusElement.textContent =
            "غير موجود في المكتب";


        supervisorStatusDot.className =
            "status-dot offline";
    }

    else {

        supervisorStatusElement.textContent =
            "حالة المشرف غير محددة";


        supervisorStatusDot.className =
            "status-dot offline";
    }
}


/* =====================================================
   مهام المتدرب
===================================================== */

function getMyTasks() {

    const trainee =
        getOriginalTrainee();


    const allTasks =
        readArray(
            TASKS_KEY
        );


    const traineeId =
        trainee.id;


    const traineeEmail =
        trainee.email ||
        currentTrainee.email;


    return allTasks.filter(
        task => {

            /*
                الطريقة الأساسية:
                traineeId
            */

            if (
                traineeId !== undefined &&
                traineeId !== null &&

                task.traineeId !== undefined &&
                task.traineeId !== null &&

                String(
                    task.traineeId
                ) ===
                String(
                    traineeId
                )
            ) {

                return true;
            }


            /*
                احتياط بالبريد
            */

            if (
                traineeEmail &&
                task.traineeEmail &&

                normalize(
                    task.traineeEmail
                ) ===
                normalize(
                    traineeEmail
                )
            ) {

                return true;
            }


            return false;
        }
    );
}


/* =====================================================
   حالات المهمة
===================================================== */

function isTaskCompleted(task) {

    const status =
        normalize(
            task.status
        );


    return (

        status === "completed" ||

        status === "done" ||

        status === "مكتملة" ||

        status === "منجزة" ||

        status === "تم الإنجاز"
    );
}


function isTaskProgress(task) {

    const status =
        normalize(
            task.status
        );


    return (

        status === "progress" ||

        status === "in-progress" ||

        status === "in_progress" ||

        status === "قيد التنفيذ"
    );
}


/* =====================================================
   حماية النصوص
===================================================== */

function escapeHTML(value) {

    return String(
        value ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =====================================================
   عرض المهام الحالية
===================================================== */

function renderTasks() {

    const allMyTasks =
        getMyTasks();


    /*
        الإحصائيات
    */

    totalTasksElement.textContent =
        allMyTasks.length;


    const completed =
        allMyTasks.filter(
            task =>
                isTaskCompleted(task)
        );


    completedTasksElement.textContent =
        completed.length;


    /*
        الحالية =
        كل شيء ما عدا المكتملة
    */

    const currentTasks =
        allMyTasks.filter(
            task =>
                !isTaskCompleted(task)
        );


    tasksList.innerHTML =
        "";


    /*
        لا توجد مهام
    */

    if (
        currentTasks.length === 0
    ) {

        tasksList.innerHTML = `

            <div class="empty-tasks">

                <div class="empty-icon">

                    <i class="fa-solid fa-list-check"></i>

                </div>

                <h3>
                    لا توجد مهام حالية
                </h3>

                <p>
                    أي مهمة جديدة يسندها لك
                    مشرفك ستظهر هنا.
                </p>

            </div>
        `;


        return;
    }


    /*
        الأحدث أولاً
        وأقصى شيء 3 مهام
    */

    const latestTasks =

        [...currentTasks]

            .sort(
                (a, b) => {

                    return (
                        new Date(
                            b.createdAt || 0
                        ) -

                        new Date(
                            a.createdAt || 0
                        )
                    );
                }
            )

            .slice(
                0,
                3
            );


    latestTasks.forEach(
        task => {

            const taskElement =
                document.createElement(
                    "div"
                );


            taskElement.className =
                "task-item";


            const title =

                task.title ||

                task.taskTitle ||

                task.name ||

                "مهمة";


            const description =

                task.description ||

                task.details ||

                "مهمة مسندة إليك";


            let statusText =
                "جديدة";


            let statusClass =
                "pending";


            if (
                isTaskProgress(task)
            ) {

                statusText =
                    "قيد التنفيذ";

                statusClass =
                    "progress";
            }


            taskElement.innerHTML = `

                <div
                    class="task-icon ${statusClass}"
                >

                    <i class="fa-solid fa-list-check"></i>

                </div>


                <div class="task-info">

                    <strong>
                        ${escapeHTML(
                            title
                        )}
                    </strong>

                    <span>
                        ${escapeHTML(
                            description
                        )}
                    </span>

                </div>


                <span
                    class="task-status ${statusClass}"
                >

                    ${statusText}

                </span>
            `;


            /*
                الضغط على المهمة
                يفتح تفاصيلها
            */

            taskElement.style.cursor =
                "pointer";


            taskElement.addEventListener(
                "click",
                function () {

                    localStorage.setItem(
                        "trainflow_selected_task",
                        task.id
                    );


                    window.location.href =
                        "task-details.html";
                }
            );


            tasksList.appendChild(
                taskElement
            );
        }
    );
}


/* =====================================================
   التقارير
===================================================== */

function loadReportsCount() {

    const trainee =
        getOriginalTrainee();


    const reports =
        readArray(
            REPORTS_KEY
        );


    const myReports =
        reports.filter(
            report => {

                if (
                    trainee.id !== undefined &&
                    report.traineeId !== undefined &&

                    String(
                        report.traineeId
                    ) ===
                    String(
                        trainee.id
                    )
                ) {

                    return true;
                }


                if (
                    trainee.email &&
                    report.traineeEmail &&

                    normalize(
                        trainee.email
                    ) ===
                    normalize(
                        report.traineeEmail
                    )
                ) {

                    return true;
                }


                return false;
            }
        );


    totalReportsElement.textContent =
        myReports.length;
}


/* =====================================================
   تحديث الصفحة
===================================================== */

function refreshDashboard() {

    loadTraineeName();

    loadSupervisorInformation();

    renderTasks();

    loadReportsCount();
}


/* =====================================================
   التشغيل
===================================================== */

refreshDashboard();


/* =====================================================
   تحديث تلقائي عند تغير LocalStorage
===================================================== */

window.addEventListener(
    "storage",
    function () {

        refreshDashboard();
    }
);


/* =====================================================
   تحديث عند الرجوع للصفحة
===================================================== */

window.addEventListener(
    "focus",
    function () {

        refreshDashboard();
    }
);


/* =====================================================
   تحديث عند الرجوع بزر Back
===================================================== */

window.addEventListener(
    "pageshow",
    function () {

        refreshDashboard();
    }
);


/* =====================================================
   تسجيل الخروج
===================================================== */

document
    .getElementById(
        "logoutButton"
    )
    .addEventListener(
        "click",
        function () {

            localStorage.removeItem(
                CURRENT_USER_KEY
            );


            localStorage.removeItem(
                "traineeLoggedIn"
            );


            window.location.href =
                "login.html";
        }
    );

</script>
