<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TrainFlow | لوحة المتدرب</title><link rel="stylesheet" href="trainee-dashboard.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div><aside class="sidebar"><div class="brand"><div class="brand-icon"><i class="fa-solid fa-user-graduate"></i></div><div><h1>TrainFlow</h1><small>Trainee Panel</small></div></div><nav class="side-nav"><a href="trainee-dashboard.html" class="active"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a><a href="tasks.html" class=""><i class="fa-solid fa-list-check"></i><span>مهامي</span></a><a href="daily-report.html" class=""><i class="fa-solid fa-pen-to-square"></i><span>التقرير اليومي</span></a><a href="profile.html" class=""><i class="fa-solid fa-user"></i><span>الملف الشخصي</span></a></nav><div class="side-bottom"><a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i><span>تسجيل الخروج</span></a></div></aside><main class="dashboard"><header class="dash-head"><div><p class="muted">لوحة المتدرب</p><h1 id="welcome">أهلاً</h1><p class="muted">تابع مهامك واكتب تقريرك اليومي.</p></div><a class="btn" href="daily-report.html"><i class="fa-solid fa-pen-to-square"></i> التقرير اليومي</a></header><section class="stats-grid"><div class="card stat"><div class="ico"><i class="fa-solid fa-list-check"></i></div><div><span>إجمالي مهامي</span><strong id="all">0</strong></div></div><div class="card stat"><div class="ico"><i class="fa-solid fa-check"></i></div><div><span>مكتملة</span><strong id="done">0</strong></div></div><div class="card stat"><div class="ico"><i class="fa-solid fa-clock"></i></div><div><span>قيد التنفيذ</span><strong id="progress">0</strong></div></div><div class="card stat"><div class="ico"><i class="fa-solid fa-chart-line"></i></div><div><span>نسبة الإنجاز</span><strong id="percent">0%</strong></div></div></section><section class="dash-grid"><div class="card"><div class="toolbar"><div class="section-title"><span>مهامي</span><h2>المهام الحالية</h2></div><a class="btn secondary" href="tasks.html">عرض الكل</a></div><div id="taskList" class="list"></div></div><aside><div class="card"><div class="section-title"><span>المشرف</span><h2>المشرف المسؤول</h2></div><div id="supervisorInfo" class="list-main"></div></div><div class="card" style="margin-top:16px"><div class="section-title"><span>اليوم</span><h2>التقرير اليومي</h2><p id="reportState"></p></div><a class="btn" style="width:100%" href="daily-report.html">فتح التقرير</a></div></aside></section></main><script>
const TF={
 get(k,f=[]){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},
 set(k,v){localStorage.setItem(k,JSON.stringify(v))},
 users(){return this.get('tf_users',[])}, tasks(){return this.get('tf_tasks',[])}, reports(){return this.get('tf_reports',[])}, invites(){return this.get('tf_invites',[])},
 session(){const id=localStorage.getItem('tf_session');return this.users().find(u=>u.id===id)||null},
 id(p='id'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
 esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))},
 date(s){if(!s)return '-';return new Date(s+'T00:00:00').toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'})},
 logout(){localStorage.removeItem('tf_session');location.href='login.html'},
 require(role){const u=this.session();if(!u){location.href='login.html';return null}if(role&&u.role!==role){location.href=u.role==='supervisor'?'supervisor-dashboard.html':'trainee-dashboard.html';return null}return u}
};

const u=TF.require('trainee');if(u){document.getElementById('logoutBtn').onclick=e=>{e.preventDefault();TF.logout()};document.getElementById('welcome').textContent='أهلاً '+u.name;const sup=TF.users().find(x=>x.id===u.supervisorId),tasks=TF.tasks().filter(t=>t.traineeId===u.id),done=tasks.filter(t=>t.status==='completed').length,prog=tasks.filter(t=>t.status==='progress').length;document.getElementById('all').textContent=tasks.length;document.getElementById('done').textContent=done;document.getElementById('progress').textContent=prog;document.getElementById('percent').textContent=(tasks.length?Math.round(done/tasks.length*100):0)+'%';document.getElementById('supervisorInfo').innerHTML=sup?`<h3>${TF.esc(sup.name)}</h3><p>${TF.esc(sup.email)}</p>`:'<p>لا يوجد مشرف مرتبط</p>';document.getElementById('taskList').innerHTML=tasks.length?tasks.slice().sort((a,b)=>(a.status==='completed')-(b.status==='completed')).slice(0,5).map(t=>`<div class="list-item"><div class="list-main"><h3>${TF.esc(t.title)}</h3><p>${TF.date(t.dueDate)}</p></div><a class="ghost-btn" href="task-details.html?id=${t.id}">فتح</a></div>`).join(''):'<div class="empty"><i class="fa-solid fa-list-check"></i><h3>لا توجد مهام مضافة لك</h3><p>ستظهر هنا المهام التي يضيفها مشرفك.</p></div>';const today=new Date().toISOString().slice(0,10),rep=TF.reports().find(r=>r.traineeId===u.id&&r.date===today);document.getElementById('reportState').textContent=rep?'تم إرسال تقرير اليوم ويمكنك تعديله.':'لم تكتب تقرير اليوم بعد.'}</script></body></html>
