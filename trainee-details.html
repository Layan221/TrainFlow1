<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TrainFlow | تفاصيل المتدرب</title><link rel="stylesheet" href="trainee-details.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div><main class="container"><a class="ghost-btn" href="supervisor-dashboard.html"><i class="fa-solid fa-arrow-right"></i> العودة للوحة التحكم</a><div id="content" style="margin-top:20px"></div></main><script>
const TF={
 get(k,f=[]){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},
 set(k,v){localStorage.setItem(k,JSON.stringify(v))},
 users(){return this.get('tf_users',[])}, tasks(){return this.get('tf_tasks',[])}, reports(){return this.get('tf_reports',[])}, invites(){return this.get('tf_invites',[])},
 session(){const id=localStorage.getItem('tf_session');return this.users().find(u=>u.id===id)||null},
 id(p='id'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
 esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))},
 date(s){if(!s)return '-';return new Date(s+'T00:00:00').toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'})},
 logout(){localStorage.removeItem('tf_session');location.href='login.html'},
 require(role){const u=this.session();if(!u){location.href='login.html';return null}if(role&&u.role!==role){location.href=u.role==='supervisor'?'supervisor-dashboard.html':'trainee-dashboard.html';return null}return u}
};

const u=TF.require('supervisor');if(u){const id=new URLSearchParams(location.search).get('id'),tr=TF.users().find(x=>x.id===id&&x.role==='trainee'&&x.supervisorId===u.id);if(!tr){document.getElementById('content').innerHTML='<div class="card empty"><h3>المتدرب غير موجود أو غير مرتبط بك</h3></div>'}else{const tasks=TF.tasks().filter(t=>t.traineeId===tr.id),reports=TF.reports().filter(r=>r.traineeId===tr.id).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('content').innerHTML=`<div class="toolbar"><div class="section-title"><span>بيانات المتدرب</span><h2>${TF.esc(tr.name)}</h2><p>${TF.esc(tr.email)}${tr.trainingField?' • '+TF.esc(tr.trainingField):''}</p></div><a class="btn" href="add-task.html?trainee=${tr.id}"><i class="fa-solid fa-plus"></i> إضافة مهمة</a></div><section class="stats-grid"><div class="card stat"><div><span>المهام</span><strong>${tasks.length}</strong></div></div><div class="card stat"><div><span>المكتملة</span><strong>${tasks.filter(t=>t.status==='completed').length}</strong></div></div><div class="card stat"><div><span>التقارير</span><strong>${reports.length}</strong></div></div><div class="card stat"><div><span>الإنجاز</span><strong>${tasks.length?Math.round(tasks.filter(t=>t.status==='completed').length/tasks.length*100):0}%</strong></div></div></section><section class="dash-grid"><div class="card"><div class="section-title"><span>المهام</span><h2>مهام المتدرب</h2></div><div class="list">${tasks.length?tasks.map(t=>`<div class="list-item"><div class="list-main"><h3>${TF.esc(t.title)}</h3><p>${TF.date(t.dueDate)}${t.traineeNote?'<br>ملاحظة المتدرب: '+TF.esc(t.traineeNote):''}</p></div><a class="ghost-btn" href="task-details.html?id=${t.id}">فتح</a></div>`).join(''):'<div class="empty"><h3>لا توجد مهام</h3></div>'}</div></div><aside class="card"><div class="section-title"><span>آخر التقارير</span><h2>التقارير اليومية</h2></div><div class="list">${reports.length?reports.slice(0,5).map(r=>`<div class="list-item"><div class="list-main"><h3>${TF.date(r.date)}</h3><p>${TF.esc(r.work).slice(0,80)}</p></div></div>`).join(''):'<div class="empty"><h3>لا توجد تقارير بعد</h3></div>'}</div><a class="btn secondary" style="width:100%;margin-top:12px" href="reports.html?trainee=${tr.id}">عرض كل التقارير</a></aside></section>`}}</script></body></html>
