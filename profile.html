<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TrainFlow | الملف الشخصي</title><link rel="stylesheet" href="profile.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div><main class="container"><button class="ghost-btn" id="back"><i class="fa-solid fa-arrow-right"></i> العودة للوحة التحكم</button><div class="section-title" style="margin-top:20px"><span>الحساب</span><h2>الملف الشخصي</h2></div><section class="dash-grid"><div class="card"><form id="form"><div class="form-group"><label>الاسم الكامل</label><input class="input" id="name" required></div><div class="form-group"><label>البريد الإلكتروني</label><input class="input" id="email" type="email" disabled></div><div class="form-group" id="fieldWrap"><label>مجال التدريب</label><input class="input" id="field"></div><div class="form-group"><label>نبذة</label><textarea class="textarea" id="bio"></textarea></div><div id="msg" class="message"></div><button class="btn" type="submit">حفظ التعديلات</button></form></div><aside class="card"><div class="section-title"><span>نوع الحساب</span><h2 id="role"></h2></div><div id="extra"></div></aside></section></main><script>
const TF={
 get(k,f=[]){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},
 set(k,v){localStorage.setItem(k,JSON.stringify(v))},
 users(){return this.get('tf_users',[])}, tasks(){return this.get('tf_tasks',[])}, reports(){return this.get('tf_reports',[])}, invites(){return this.get('tf_invites',[])},
 session(){const id=localStorage.getItem('tf_session');return this.users().find(u=>u.id===id)||null},
 id(p='id'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
 esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))},
 date(s){if(!s)return '-';return new Date(s+'T00:00:00').toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'})},
 logout(){localStorage.removeItem('tf_session');location.href='login.html'},
 require(role){const u=this.session();if(!u){location.href='login.html';return null}if(role&&u.role!==role){location.href=u.role==='supervisor'?'supervisor-dashboard.html':'trainee-dashboard.html';return null}return u}
};

const u=TF.require();if(u){document.getElementById('back').onclick=()=>location.href=u.role==='supervisor'?'supervisor-dashboard.html':'trainee-dashboard.html';document.getElementById('name').value=u.name;document.getElementById('email').value=u.email;document.getElementById('field').value=u.trainingField||'';document.getElementById('bio').value=u.bio||'';document.getElementById('role').textContent=u.role==='supervisor'?'مشرف':'متدرب';if(u.role==='supervisor'){document.getElementById('fieldWrap').classList.add('hidden');document.getElementById('extra').innerHTML=`<div class="code-box"><span class="muted">كود ربط المتدربين</span><div class="code">${u.supervisorLinkCode}</div></div>`}else{const sup=TF.users().find(x=>x.id===u.supervisorId);document.getElementById('extra').innerHTML=`<p class="muted">المشرف المسؤول</p><h3 style="margin-top:5px">${TF.esc(sup?.name||'غير مرتبط')}</h3>`}document.getElementById('form').onsubmit=e=>{e.preventDefault();let users=TF.users(),i=users.findIndex(x=>x.id===u.id);users[i].name=document.getElementById('name').value.trim();users[i].bio=document.getElementById('bio').value.trim();if(u.role==='trainee')users[i].trainingField=document.getElementById('field').value.trim();TF.set('tf_users',users);document.getElementById('msg').className='message success';document.getElementById('msg').textContent='تم حفظ التعديلات'}}</script></body></html>
